// Editing helpers (setCaptain, toggleFlex, removeSlot, clearLineup) mutate S.lineup and call onLineupEdit().

const SLOT_KEYS = ['cpt', 0, 1, 2, 3, 4]

function lineupIds() { return [S.lineup.cpt, ...S.lineup.flex].filter(Boolean) }
function lineupHas(id) { return S.lineup.cpt === id || S.lineup.flex.includes(id) }
function lineupSlotOf(id) { if (S.lineup.cpt === id) return 'cpt'; const i = S.lineup.flex.indexOf(id); return i >= 0 ? i : null }
function lineupComplete() { return lineupIds().length === 6 }

// Local, instant validation (the engine's validate() is authoritative once ready; the rules are the same).
function localValidate(lineup) {
  const errors = []
  let salary = 0
  const split = {}; split[S.meta.home] = 0; split[S.meta.away] = 0
  const cpt = lineup.cpt ? S.byId.get(lineup.cpt) : null
  if (cpt) { salary += cpt.cptSalary; split[cpt.team]++ }
  for (const id of lineup.flex) { const p = id && S.byId.get(id); if (p) { salary += p.salary; split[p.team]++ } }
  const n = [lineup.cpt, ...lineup.flex].filter(Boolean).length
  if (n < 6) errors.push(`${6 - n} slot${6 - n === 1 ? '' : 's'} empty`)
  if (salary > CAP) errors.push(`${money(salary - CAP)} over the $50,000 cap`)
  if (n === 6 && (split[S.meta.home] === 0 || split[S.meta.away] === 0)) errors.push('Needs a player from each team')
  return { ok: errors.length === 0, salary, salaryLeft: CAP - salary, errors, split }
}

function setCaptain(id) {
  pushUndo()
  if (id) {
    const i = S.lineup.flex.indexOf(id)
    if (i >= 0) { S.lineup.flex[i] = null }
    const old = S.lineup.cpt
    S.lineup.cpt = id
    if (old && old !== id) { const j = i >= 0 ? i : S.lineup.flex.indexOf(null); if (j >= 0) S.lineup.flex[j] = old }
  } else S.lineup.cpt = null
  S.selected = null
  if (id) S.mode = 'flex'
  onLineupEdit()
}

// Add to FLEX (the selected slot, else the first empty one); if already in the lineup, remove.
function toggleFlex(id) {
  pushUndo()
  const i = S.lineup.flex.indexOf(id)
  if (i >= 0) S.lineup.flex[i] = null
  else if (S.lineup.cpt === id && S.selected == null) S.lineup.cpt = null
  else {
    if (S.lineup.cpt === id) S.lineup.cpt = null
    if (S.selected === 'cpt') { S.lineup.cpt = id; S.selected = null; onLineupEdit(); return }
    const j = S.selected != null ? S.selected : S.lineup.flex.indexOf(null)
    if (j < 0) { S.undo.pop(); flashMsg('All five FLEX slots are full: click a slot to replace him, or remove one'); return }
    S.lineup.flex[j] = id
    S.selected = null
  }
  onLineupEdit()
}

function removeSlot(slot) {
  pushUndo()
  if (slot === 'cpt') S.lineup.cpt = null; else S.lineup.flex[slot] = null
  if (S.selected === slot) S.selected = null
  onLineupEdit()
}

function applySwap(slot, id) {
  pushUndo()
  if (slot === 'cpt') { const i = S.lineup.flex.indexOf(id); if (i >= 0) S.lineup.flex[i] = S.lineup.cpt; S.lineup.cpt = id }
  else { if (S.lineup.cpt === id) S.lineup.cpt = S.lineup.flex[slot]; const i = S.lineup.flex.indexOf(id); if (i >= 0) S.lineup.flex[i] = S.lineup.flex[slot]; S.lineup.flex[slot] = id }
  onLineupEdit()
}

function clearLineup() {
  if (!lineupIds().length) return
  pushUndo()
  S.lineup = { cpt: null, flex: [null, null, null, null, null] }
  S.selected = null
  onLineupEdit()
  showToast('Lineup cleared', 'Undo', undoEdit)
}

function pushUndo() { S.undo.push(JSON.stringify(S.lineup)); if (S.undo.length > 100) S.undo.shift(); S.redo.length = 0 }
function undoEdit() { if (!S.undo.length) return; S.redo.push(JSON.stringify(S.lineup)); S.lineup = JSON.parse(S.undo.pop()); S.selected = null; onLineupEdit() }
function redoEdit() { if (!S.redo.length) return; S.undo.push(JSON.stringify(S.lineup)); S.lineup = JSON.parse(S.redo.pop()); S.selected = null; onLineupEdit() }

function ownTag(p, isC) {
  const kind = isC ? 'cpt' : 'flex'
  // TwoGunGPT's posted figure only; nothing posted shows "—" (never 0, never guessed)
  const label = isC ? 'Captain' : 'FLEX'
  if (!(p.own && p.own[kind] != null)) return `<span class="own" title="No ${label} ownership posted by TwoGunGPT: the simulated field never plays him at ${label}">— own</span>`
  return `<span class="own" title="${label} ownership posted by TwoGunGPT">${fmtOwn(p.own[kind])}% own</span>`
}

// Up to three swap chips for a slot, from the last analysis.
function swapChips(slot) {
  const a = S.analysis
  const s = a && a.swaps && a.swaps.find(x => String(x.slot) === String(slot))
  if (!s || !s.options.length) return ''
  return `<span class="chips">` + s.options.filter(o => o.legal !== false).slice(0, 3).map(o => {
    const p = S.byId.get(o.id); if (!p) return ''
    const base = a.feasibility ? a.feasibility.pTop1pct : null   // chips read the change in the top-1% rate
    return `<button class="swc ${cls(o.deltaTop1pct)}" data-swap="${slot}" data-id="${o.id}" title="Swap in ${esc(p.name)}: ${top1FromTo(base, o)}; copies ${signed(o.deltaCopies, 2)}; salary ${signedMoney(o.deltaSalary)}${o.approx ? '; approximate in this contest size' : ''}. Click to apply.">${esc(lastName(p.name))} <b>${top1Pts(o.deltaTop1pct)}</b></button>`
  }).join('') + `</span>`
}

function slotHtml(slot, id) {
  const isC = slot === 'cpt'
  const p = id ? S.byId.get(id) : null
  const sel = S.selected === slot ? ' sel' : ''
  const lab = isC ? 'CPT' : 'FLEX'
  if (!p) return `<div class="slot ${isC ? 'cpt' : ''} empty${sel}" data-slot="${slot}" title="${isC ? 'Captain: 1.5x salary, 1.5x points. Click C on a player, shift-click his row, or drop him here.' : 'FLEX slot. Click a player row, or drop one here.'}">
<span class="lab">${lab}${isC ? '<em>1.5×</em>' : ''}</span><span class="av ph"></span><span class="who"><span class="nm dim">${isC ? 'Pick a captain' : 'Empty slot'}</span><span class="sub dim">${S.selected === slot ? 'selected: next click fills it' : 'click a player in the pool'}</span></span><span class="sal dim">–</span><button class="x" disabled>×</button></div>`
  return `<div class="slot ${isC ? 'cpt' : ''} filled ${p.team}${sel}" data-slot="${slot}" draggable="true" title="${esc(playerTitle(p))}\nClick to select this slot (the next pool click replaces him); drag to reorder; Delete removes him">
<span class="lab">${lab}${isC ? '<em>1.5×</em>' : ''}</span>
${avatarFor(p, isC ? 52 : 44)}
<span class="who"><span class="nm">${esc(p.name)}${p.injury ? '<i class="inj"></i>' : ''}</span><span class="sub">${teamTag(p)}<span class="pos-c ${p.pos}">${p.pos}</span>${ownTag(p, isC)}<span class="pts" title="${isC ? 'Projection (average) x1.5 / ceiling x1.5 as Captain' : 'Projection (average) / ceiling'}">${(p.projection * (isC ? 1.5 : 1)).toFixed(1)} <span class="dim">/</span> ${(p.ceiling * (isC ? 1.5 : 1)).toFixed(1)}</span>${swapChips(slot)}<span class="sal m" title="${isC ? TIP.cptSal : TIP.flexSal}">${money(isC ? p.cptSalary : p.salary)}</span></span></span>
<span class="sal d" title="${isC ? TIP.cptSal : TIP.flexSal}">${money(isC ? p.cptSalary : p.salary)}</span>
<button class="x" data-remove="${slot}" title="Remove">×</button></div>`
}

function renderLineup(v) {
  const slots = document.getElementById('slots')
  slots.innerHTML = slotHtml('cpt', S.lineup.cpt) + S.lineup.flex.map((id, i) => slotHtml(i, id)).join('')
  const sal = document.getElementById('salary')
  sal.classList.toggle('over', v.salary > CAP)
  sal.querySelector('.bar i').style.width = Math.min(100, v.salary / CAP * 100) + '%'
  sal.querySelector('.spent').textContent = money(v.salary) + ' spent'
  const open = 6 - lineupIds().length
  const perSpot = v.salary <= CAP && open > 0 ? ` <span class="perspot" title="Average salary left for each open spot (a Captain costs 1.5x)">· ${money(v.salaryLeft / open)}/spot</span>` : ''
  sal.querySelector('.left').innerHTML = (v.salary > CAP ? money(v.salary - CAP) + ' over' : money(v.salaryLeft) + ' left') + perSpot
  const split = document.getElementById('split')
  const h = S.meta.home, a = S.meta.away
  const n = v.split[h] + v.split[a]
  split.innerHTML = `<span class="splab">${n ? `${v.split[h]} ${h} · ${v.split[a]} ${a}` : 'team split'}</span><span class="spbar"><span class="sp ${h}" style="flex:${v.split[h] || 0}"></span><span class="sp ${a}" style="flex:${v.split[a] || 0}"></span></span>`
  split.title = 'Team split. The field: ' + Object.entries(S.snapshot.field.splits || {}).map(([k, x]) => `${k} ${x}%`).join(', ')
  const msg = document.getElementById('lmsg')
  if (S.flash) { msg.textContent = S.flash; msg.className = 'msg bad'; S.flash = null }
  else if (!lineupIds().length) { msg.textContent = 'Click a player to add him; C (or shift-click) makes him Captain'; msg.className = 'msg' }
  else if (v.ok) { msg.textContent = 'Legal lineup'; msg.className = 'msg ok' }
  else { msg.textContent = v.errors.join(' · '); msg.className = 'msg ' + (lineupComplete() || v.salary > CAP ? 'bad' : '') }
  document.getElementById('undo-b').disabled = !S.undo.length
  document.getElementById('redo-b').disabled = !S.redo.length
}

function flashMsg(text) { S.flash = text; renderLineup(localValidate(S.lineup)) }

// ---- Save (D17): adds the finished lineup to the Saved lineups view (store.js); the builder is left as it is ----
function saveLineup() {
  if (!lineupComplete()) { flashMsg('Fill all six slots before saving'); return }
  const key = savedDupKey(S.lineup.cpt, S.lineup.flex)
  const stats = S.analysis && S.analysisFor === key ? savedStatsFrom(S.analysis, S.contest) : null   // only an analysis of THIS lineup
  const res = savedStoreAdd(S.lineup, S.byId, stats)
  if (res.status === 'dup') { showToast(`Duplicate — not saved again. This lineup is already #${res.record.seq}.`, 'View', () => savedShow(res.record.uid), 'warn'); return }
  if (res.status !== 'saved') return
  const uid = res.record.uid, seq = res.record.seq
  if (!stats) savedScoreQueue(res.record)      // saved before its own analysis landed: scored as soon as the model can
  const view = () => savedShow(uid)
  const lost = !SAVED_STATE.localOk && !savedStoreHasDb()
  showToast(lost ? `Saved as #${seq}, but this browser isn't keeping saved lineups; they'll be lost on reload` : `Saved as #${seq}`, 'View', view)
  res.sync.then(st => {
    const r = savedStoreFind(uid), now = r ? r.seq : seq      // a db read may move it to the next free number
    if (st === 'write-failed' || st === 'load-failed') showToast(`#${now} saved here; will sync when Claude is reachable`, 'View', view)
    else if (now !== seq) showToast(`Saved as #${now}`, 'View', view)
  })
}

function lineupHtml() {
  return `<div class="card lineup">
<h2>Lineup <span class="dim">· DK Showdown · $50,000 cap</span><span class="right"><button class="btn sm" id="undo-b" title="Undo (Ctrl+Z)">↶ undo</button> <button class="btn sm" id="redo-b" title="Redo (Ctrl+Y)">↷</button></span></h2>
<div class="slots" id="slots"></div>
<div class="salary" id="salary"><span class="spent" title="Salary spent (Captain at 1.5x)">$0 spent</span><span class="bar"><i></i></span><span class="left" title="Salary left under the $50,000 cap">$50,000 left</span></div>
<div class="foot"><span class="split" id="split"></span><span class="msg" id="lmsg"></span><button class="btn sm" id="clear-b" title="Empty every slot (Undo available)">Clear</button><button class="btn sm primary" id="save-b" title="Add this lineup to Saved lineups (the builder stays as it is)">Save</button></div>
</div>`
}

function bindLineup() {
  document.getElementById('slots').addEventListener('click', ev => {
    const sw = ev.target.closest('button[data-swap]')
    if (sw) { applySwap(sw.dataset.swap === 'cpt' ? 'cpt' : +sw.dataset.swap, sw.dataset.id); return }
    const x = ev.target.closest('button[data-remove]')
    if (x) { removeSlot(x.dataset.remove === 'cpt' ? 'cpt' : +x.dataset.remove); return }
    const slot = ev.target.closest('.slot'); if (!slot) return
    const key = slot.dataset.slot === 'cpt' ? 'cpt' : +slot.dataset.slot
    S.selected = S.selected === key ? null : key
    if (key === 'cpt') S.mode = S.selected === 'cpt' ? 'cpt' : 'flex'
    renderLineup(localValidate(S.lineup)); renderPool()
  })
  document.getElementById('clear-b').addEventListener('click', clearLineup)
  document.getElementById('save-b').addEventListener('click', saveLineup)
  document.getElementById('undo-b').addEventListener('click', undoEdit)
  document.getElementById('redo-b').addEventListener('click', redoEdit)
  bindDragDrop()
}

// Drag and drop: pool rows/cards onto slots, slots between slots (swap), a slot onto the captain slot (promote).
function bindDragDrop() {
  const slots = document.getElementById('slots')
  document.getElementById('pool-wrap').addEventListener('dragstart', ev => {
    const el = ev.target.closest('[data-id]'); if (!el) return
    if (poolLockById(el.dataset.id)) { ev.preventDefault(); return }   // locked pool players cannot be dragged (Adam 2026-10-12, D13)
    ev.dataTransfer.setData('text/plain', 'pool:' + el.dataset.id); ev.dataTransfer.effectAllowed = 'copy'
  })
  slots.addEventListener('dragstart', ev => {
    const s = ev.target.closest('.slot.filled'); if (!s) return
    ev.dataTransfer.setData('text/plain', 'slot:' + s.dataset.slot); ev.dataTransfer.effectAllowed = 'move'
  })
  slots.addEventListener('dragover', ev => { const s = ev.target.closest('.slot'); if (s) { ev.preventDefault(); s.classList.add('over') } })
  slots.addEventListener('dragleave', ev => { const s = ev.target.closest('.slot'); if (s) s.classList.remove('over') })
  slots.addEventListener('drop', ev => {
    const s = ev.target.closest('.slot'); if (!s) return
    ev.preventDefault(); s.classList.remove('over')
    const data = ev.dataTransfer.getData('text/plain') || ''
    const to = s.dataset.slot === 'cpt' ? 'cpt' : +s.dataset.slot
    if (data.startsWith('pool:')) { const id = data.slice(5); if (lineupHas(id)) applySwap(to, id); else if (to === 'cpt') setCaptain(id); else { S.selected = to; toggleFlex(id) } }
    else if (data.startsWith('slot:')) {
      const from = data.slice(5) === 'cpt' ? 'cpt' : +data.slice(5)
      if (from === to) return
      pushUndo()
      const get = k => k === 'cpt' ? S.lineup.cpt : S.lineup.flex[k]
      const set = (k, val) => { if (k === 'cpt') S.lineup.cpt = val; else S.lineup.flex[k] = val }
      const a = get(from), b = get(to); set(from, b); set(to, a)
      onLineupEdit()
    }
  })
}


// ---- src/ui/saved.js ----
// The Saved lineups view (ruling D17), reached from the Build | Saved lineups switch under the header.
// Cards in save order (#1 first) with rename, Load and Delete (inline confirm); "Only lineups with:" player filter
// (AND across chips; each chip is CPT, FLEX or Any — Adam 2026-10-12); exposure table over the lineups shown.
// Data comes from store.js (savedStore*).

const SAVED_UI = { filter: [], expSort: { key: 'count', dir: -1 }, renaming: null, confirmDel: null, focus: null }

// ---- late scoring: Save never waits for the model. A lineup saved before its own analysis landed is queued here
// (this visit only); the builder's analysis of the same lineup fills it, otherwise the engine scores the saved
// lineup itself in the background once ready. A result is used only if the engine and contest are unchanged. ----
const SAVED_SCORE = new Map()   // uid -> {cpt, flex}
const SAVED_SCORE_FAILED = new Set()   // uids the engine could not score this visit
let savedScoreBusy = false, savedScoreAgain = false

function savedScoreQueue(rec) { SAVED_SCORE.set(rec.uid, { cpt: rec.cpt, flex: rec.flex.slice() }); savedScoreRun() }

// A score without a finite top-1% rate and copies cannot complete the record: it is marked failed for this visit, so
// savedScoreRun does not re-queue it at every ready.
function savedScoreFill(uid, stats) {
  SAVED_SCORE.delete(uid)
  if (!savedStatsComplete(stats)) { SAVED_SCORE_FAILED.add(uid); savedViewRender(); return }
  savedSyncToast(savedStoreFillStats(uid, stats), 'Scored')
}

// Called by runAnalysis when the builder's analysis lands.
function savedScoreFromBuilder() {
  if (!S.analysis || !S.analysisFor) return
  for (const [uid, l] of [...SAVED_SCORE]) if (savedDupKey(l.cpt, l.flex) === S.analysisFor) savedScoreFill(uid, savedStatsFrom(S.analysis, S.contest))
}

// Called on save and whenever the engine becomes ready (start, refresh, contest change).
async function savedScoreRun() {
  if (savedScoreBusy) { savedScoreAgain = true; return }     // a pass is running: go round once more when it ends
  if (!S.ready || !S.host) return
  // every lineup on this slate still without figures (saved on an earlier visit, imported) joins the queue;
  // one that failed to score this visit is not retried
  // (a record without a top-1% rate or copies, e.g. a v1 import, counts as without figures)
  for (const r of savedStoreList()) if (savedNeedsScore(r) && !SAVED_SCORE.has(r.uid) && !SAVED_SCORE_FAILED.has(r.uid)) SAVED_SCORE.set(r.uid, { cpt: r.cpt, flex: r.flex.slice() })
  if (!SAVED_SCORE.size) return
  savedViewRender()
  savedScoreBusy = true
  try {
    for (const [uid, l] of [...SAVED_SCORE]) {
      if (!SAVED_SCORE.has(uid)) continue
      const host = S.host, contest = S.contest
      let a = null
      try { a = await host.analyze({ cpt: l.cpt, flex: l.flex.slice() }) }
      catch (e) { console.warn('Saved lineups: could not score #' + uid, e); SAVED_SCORE.delete(uid); SAVED_SCORE_FAILED.add(uid); savedViewRender(); continue }
      if (S.host !== host || S.contest !== contest || !S.ready) break      // engine or contest changed: the next ready retries
      if (SAVED_SCORE.has(uid)) savedScoreFill(uid, savedStatsFrom(a, contest))
    }
  } finally {
    savedScoreBusy = false
    if (savedScoreAgain) { savedScoreAgain = false; savedScoreRun() }
  }
}
const SAVED_ROLES = ['CPT', 'FLEX', 'ANY']
const SAVED_ROLE_LABEL = { CPT: 'CPT', FLEX: 'FLEX', ANY: 'Any' }

// "Saved 5:22:41 PM" today, "Saved Oct 12, 5:22:41 PM" on any other day: the moment Save was pressed (seconds so two
// quick saves read in order — Adam 2026-10-12).
function savedWhen(iso) {
  const d = new Date(iso)
  if (isNaN(d)) return ''
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' })
  return d.toDateString() === new Date().toDateString() ? `Saved ${time}` : `Saved ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, ${time}`
}

function savedSel(attr, v) { return `[${attr}="${typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&')}"]` }

// Team tag from a saved snapshot: the team text is escaped here because teamTag writes it as markup.
function savedTeamTag(p) { return p.team ? teamTag({ team: esc(p.team) }) : '' }

function savedChip(id) { return SAVED_UI.filter.find(c => c.id === id) || null }

// A name (or count) that adds its player to the filter with `role`; lit when his chip already covers that role.
function savedPickBtn(id, name, role, label, extra) {
  const c = savedChip(id)
  const on = c && (c.role === role || c.role === 'ANY' || role === 'ANY')
  const what = role === 'ANY' ? esc(name) : `${role} ${esc(name)}`
  return `<button type="button" class="svpick${on ? ' on' : ''}${extra ? ' ' + extra : ''}" data-pick="${esc(id)}" data-pname="${esc(name)}" data-role="${role}" title="${c && c.role === role ? 'Stop filtering by ' + what : 'Show only lineups with ' + what}">${label == null ? esc(name) : label}</button>`
}

function savedStatTile(label, val, klass, tip) {
  return `<span class="svstat ${klass || ''}" title="${esc(tip)}"><b>${val}</b><i>${label}</i></span>`
}

function savedStatsHtml(r) {
  const s = r.stats
  if (!s && SAVED_SCORE.has(r.uid)) return `<div class="svstats">${['top 1%', 'copies'].map(l => savedStatTile(l, '<span class="svwait">scoring…</span>', 'wait', 'The model is scoring this lineup; the figures fill in when it finishes.')).join('')}</div>`
  if (!s) return `<div class="svstats"><span class="svunscored" title="No figures yet for this lineup; the model scores it once it is ready.">Not scored</span></div>`
  // only the field size is read from a stored contest (an entry fee or return figure kept on an older record is ignored)
  const ctx = s && s.contest && s.contest.size ? ` Scored for a ${Number(s.contest.size).toLocaleString('en-US')}-entry field.` : ''
  const none = SAVED_SCORE.has(r.uid) ? 'Not captured when saved; the model is scoring it now.' : 'Not captured: the model was not ready when this lineup was saved.'
  const top1 = s && s.top1pct != null ? pct(s.top1pct, 1) : '—'
  const cop = s && s.copies != null ? s.copies.toFixed(s.copies < 10 ? 2 : 1) : '—'
  const firstTxt = s && s.pFirst != null && s.sims != null ? ` 1st: ${winsFirstOdds(s.pFirst, s.sims)}.` : ''
  return `<div class="svstats">${savedStatTile('top 1%', top1, '', s && s.top1pct != null ? 'Chance this lineup finishes in the top 1% of the field.' + firstTxt + ctx : none)}${savedStatTile('copies', cop, '', s && s.copies != null ? 'Expected duplicate copies of this lineup in the field.' + ctx : none)}</div>`
}

function savedRowHtml(p) {
  const isC = p.slot === 'CPT'
  const live = S.byId.get(p.id)
  const who = { id: p.id, name: p.name, team: esc(p.team), pos: p.pos }
  const tip = `${p.name}${p.team ? ' · ' + p.team : ''}${p.pos ? ' ' + p.pos : ''}${live ? '' : ' · no longer on the board'}`
  return `<div class="svrow${isC ? ' cpt' : ''}${p.team ? ' ' + who.team : ''}${live ? '' : ' gone'}" title="${esc(tip)}"><span class="svlab">${isC ? 'CPT' : 'FLEX'}</span><span class="svdot${p.team ? ' ' + who.team : ''}"></span>${savedPickBtn(p.id, p.name, isC ? 'CPT' : 'FLEX')}<span class="svteam">${who.team}</span><span class="svsal">${p.salary != null ? money(p.salary) : '—'}</span></div>`
}

function savedCardHtml(r, cur) {
  const nameHtml = SAVED_UI.renaming === r.uid
    ? `<span class="svren"><input type="text" maxlength="60" data-ren-input="${esc(r.uid)}" value="${esc(r.name)}" title="Enter saves, Esc cancels"><button class="btn sm primary" data-act="ren-save" data-uid="${esc(r.uid)}" title="Save the name">✓</button><button class="btn sm" data-act="ren-cancel" title="Cancel">×</button></span>`
    : `<button type="button" class="svname" data-act="ren-start" data-uid="${esc(r.uid)}" title="Click to rename">${esc(r.name)}</button>`
  const left = r.salary != null ? CAP - r.salary : null
  const totals = `<div class="svtot"><span title="${r.salary != null ? money(r.salary) + ' used' : 'Salary unknown'}">${r.salary != null ? (left < 0 ? money(-left) + ' over' : money(left) + ' left') : 'salary —'}</span><span class="dim">·</span><span title="Total projection (Captain x1.5), from TwoGunGPT when saved">Proj <b>${r.proj != null ? r.proj.toFixed(1) : '—'}</b></span></div>`
  const inB = cur === savedDupKey(r.cpt, r.flex)
  const acts = SAVED_UI.confirmDel === r.uid
    ? `<div class="svacts confirm"><span class="svconfirm">Delete #${r.seq}?</span><span class="spacer"></span><button class="btn sm danger" data-act="del-yes" data-uid="${esc(r.uid)}">Yes</button><button class="btn sm" data-act="del-no">No</button></div>`
    : `<div class="svacts"><button class="btn sm primary" data-act="load" data-uid="${esc(r.uid)}" title="Put this lineup in the builder (Undo available)">Load</button>${inB ? '<span class="svin" title="This lineup is in the builder now">in builder</span>' : ''}<span class="spacer"></span><button class="btn sm" data-act="del-start" data-uid="${esc(r.uid)}" title="Delete this saved lineup (asks first)">Delete</button></div>`
  return `<div class="svcard${inB ? ' on' : ''}${SAVED_UI.focus === r.uid ? ' focus' : ''}" data-uid="${esc(r.uid)}">
<div class="svhead"><span class="svnum">#${r.seq}</span>${nameHtml}</div>
<div class="svtime" title="${esc(new Date(r.savedAt).toString())}">${esc(savedWhen(r.savedAt))}</div>
<div class="svrows">${r.players.map(savedRowHtml).join('')}</div>
${totals}${savedStatsHtml(r)}
${acts}
</div>`
}

function savedExposureHtml(list, subtitle) {
  const ex = savedExposure(list).map(e => { const live = S.byId.get(e.id); return Object.assign(e, { proj: live ? live.projection : e.proj }) })
  const { key, dir } = SAVED_UI.expSort
  const rows = savedSortExposure(ex, dir, key)
  const th = (k, label, tip, extra) => `<th class="sort${key === k ? ' on' : ''}${extra ? ' ' + extra : ''}" data-act="exp-sort" data-key="${k}" title="${tip}">${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`
  const cnt = (e, role, n) => n ? savedPickBtn(e.id, e.name, role, String(n), 'n') : '<span class="dim">0</span>'
  return `<div class="card svexp"><h2>Exposure <span class="dim">· ${esc(subtitle)}</span></h2>
<table class="svexp-t"><thead><tr>${th('count', 'Exposure', 'Share of the lineups shown that hold him; click to sort')}${th('name', 'Player', 'Click to sort by name', 'l')}${th('cpt', 'CPT', 'Lineups with him at Captain (click a count to filter to Captain)')}${th('flex', 'FLEX', 'Lineups with him at FLEX (click a count to filter to FLEX)')}${th('team', 'Team', 'Click to sort by team')}${th('proj', 'Proj', 'TwoGunGPT projection (FLEX); click to sort')}</tr></thead><tbody>
${rows.map(e => `<tr><td><b>${Math.round(e.pct)}%</b> <span class="dim">(${e.count})</span></td><td class="l">${savedPickBtn(e.id, e.name, 'ANY')}</td><td>${cnt(e, 'CPT', e.cpt)}</td><td>${cnt(e, 'FLEX', e.flex)}</td><td>${savedTeamTag(e)}</td><td>${e.proj != null ? e.proj.toFixed(1) : '—'}</td></tr>`).join('')}
</tbody></table></div>`
}

function savedNoteHtml() {
  const out = []
  const n = SAVED_STATE.note
  if (n === 'load-failed') out.push("Couldn't load your saved lineups from Claude — showing this browser's copy. It tries again on your next save or page load.")
  if (n === 'write-failed') out.push('Saved here; will sync when Claude is reachable (on your next save or page load).')
  if (n === 'no-sync') out.push("Sync isn't available on this copy — saved lineups stay in this browser.")
  if (n === 'user-error') out.push("Couldn't reach Claude to sync saved lineups — showing this browser's copy; they won't sync on this visit.")
  if (!SAVED_STATE.localOk && SAVED_STATE.dbMode !== 'ok') out.push("This browser isn't keeping saved lineups; they'll be lost on reload.")
  return out.map(t => `<div class="svnote bad">${esc(t)}</div>`).join('')
}

function savedFilterBarHtml(shown, total) {
  if (!SAVED_UI.filter.length) return ''
  return `<div class="svfilter"><span class="dim">Only lineups with:</span>${SAVED_UI.filter.map(c => `<span class="svchip"><button type="button" class="svrole ${c.role}" data-cycle="${esc(c.id)}" title="Click to switch: Captain, FLEX or Any slot">${SAVED_ROLE_LABEL[c.role]}</button><span class="svcn">${esc(c.name)}</span><button type="button" class="svx" data-unpick="${esc(c.id)}" title="Stop filtering by ${esc(c.name)}">×</button></span>`).join('')}<button class="btn sm" data-act="clear-filter">Clear</button><span class="dim">showing ${shown} of ${total}</span></div>`
}

function savedViewRender() {
  const el = document.getElementById('view-saved')
  if (!el || el.hidden) return
  const all = savedStoreList()
  let body
  if (savedStoreArchived()) body = `<div class="card svempty">Saved lineups for this slate are archived.</div>`
  else if (!all.length) body = `<div class="card svempty">No saved lineups for this slate yet. Build one and press <b>Save</b>. <button class="btn sm primary" data-act="to-build">Go to Build</button></div>`
  else {
    SAVED_UI.filter = SAVED_UI.filter.filter(c => all.some(r => savedIdsOf(r).includes(c.id)))
    const shown = savedFilter(all, SAVED_UI.filter)
    const cur = lineupComplete() ? savedDupKey(S.lineup.cpt, S.lineup.flex) : null
    const sub = SAVED_UI.filter.length ? `${shown.length} of ${all.length} saved lineups, filtered` : `${all.length} saved lineup${all.length === 1 ? '' : 's'}`
    body = savedFilterBarHtml(shown.length, all.length) + (shown.length
      ? `<div class="svlayout${shown.length === 1 ? ' one' : ''}"><div class="svgrid">${shown.map(r => savedCardHtml(r, cur)).join('')}</div>${savedExposureHtml(shown, sub)}</div>`
      : `<div class="card svempty">No saved lineups have all of the chosen players.</div>`)
  }
  el.innerHTML = savedNoteHtml() + body
  const inp = el.querySelector('input[data-ren-input]')
  if (inp) { inp.focus(); inp.select() }
  if (SAVED_UI.focus) {
    const c = el.querySelector('.svcard' + savedSel('data-uid', SAVED_UI.focus))
    if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' })
    SAVED_UI.focus = null
  }
}

// Store changed (save, delete, rename, db sync): the tab count always, the view when it is showing.
function savedStoreChanged() {
  const n = document.getElementById('saved-count')
  if (n) n.textContent = `(${savedStoreList().length})`
  if (!SAVED_UI.renaming) savedViewRender()
}

function savedLoad(uid) {
  const r = savedStoreFind(uid); if (!r) return
  const missing = savedIdsOf(r).filter(id => !S.byId.has(id))
  pushUndo()
  S.lineup = { cpt: S.byId.has(r.cpt) ? r.cpt : null, flex: r.flex.map(id => S.byId.has(id) ? id : null) }
  S.selected = null
  appSetPage('build')
  onLineupEdit()
  showToast(missing.length ? `Loaded #${r.seq}; ${missing.length} player${missing.length === 1 ? ' is' : 's are'} no longer on the board` : `Loaded #${r.seq} into the builder`, 'Undo', undoEdit)
}

// After a store write: tell him when it stayed in this browser only.
function savedSyncToast(p, verb) {
  if (p) p.then(st => { if (st === 'write-failed' || st === 'load-failed') showToast(`${verb} here; will sync when Claude is reachable`) })
}

function savedRenameCommit(uid) {
  const inp = document.querySelector('input' + savedSel('data-ren-input', uid))
  SAVED_UI.renaming = null
  savedSyncToast(inp ? savedStoreRename(uid, inp.value) : null, 'Renamed')
  savedViewRender()
}

// One chip per player: clicking with the role his chip already has removes it; any other role sets that role.
function savedTogglePick(id, name, role) {
  role = SAVED_ROLES.includes(role) ? role : 'ANY'
  const c = savedChip(id)
  if (c && c.role === role) SAVED_UI.filter = SAVED_UI.filter.filter(x => x.id !== id)
  else if (c) SAVED_UI.filter = SAVED_UI.filter.map(x => x.id === id ? Object.assign({}, x, { role }) : x)
  else SAVED_UI.filter = SAVED_UI.filter.concat([{ id, name, role }])
  savedViewRender()
}
function savedCycleRole(id) {
  SAVED_UI.filter = SAVED_UI.filter.map(x => x.id === id ? Object.assign({}, x, { role: SAVED_ROLES[(SAVED_ROLES.indexOf(x.role) + 1) % 3] }) : x)
  savedViewRender()
}

function savedViewBind() {
  const el = document.getElementById('view-saved')
  el.addEventListener('click', ev => {
    const pick = ev.target.closest('[data-pick]')
    if (pick) { savedTogglePick(pick.dataset.pick, pick.dataset.pname, pick.dataset.role); return }
    const cy = ev.target.closest('[data-cycle]')
    if (cy) { savedCycleRole(cy.dataset.cycle); return }
    const un = ev.target.closest('[data-unpick]')
    if (un) { SAVED_UI.filter = SAVED_UI.filter.filter(x => x.id !== un.dataset.unpick); savedViewRender(); return }
    const b = ev.target.closest('[data-act]'); if (!b) return
    const uid = b.dataset.uid
    switch (b.dataset.act) {
      case 'load': savedLoad(uid); break
      case 'ren-start': SAVED_UI.renaming = uid; SAVED_UI.confirmDel = null; savedViewRender(); break
      case 'ren-save': savedRenameCommit(uid); break
      case 'ren-cancel': SAVED_UI.renaming = null; savedViewRender(); break
      case 'del-start': SAVED_UI.confirmDel = uid; SAVED_UI.renaming = null; savedViewRender(); break
      case 'del-no': SAVED_UI.confirmDel = null; savedViewRender(); break
      case 'del-yes': SAVED_UI.confirmDel = null; savedSyncToast(savedStoreDelete(uid), 'Deleted'); break
      case 'clear-filter': SAVED_UI.filter = []; savedViewRender(); break
      case 'exp-sort': {
        const k = b.dataset.key || 'count', cur = SAVED_UI.expSort
        SAVED_UI.expSort = cur.key === k ? { key: k, dir: -cur.dir } : { key: k, dir: k === 'name' || k === 'team' ? 1 : -1 }
        savedViewRender(); break
      }
      case 'to-build': appSetPage('build'); break
    }
  })
  el.addEventListener('keydown', ev => {
    const inp = ev.target.closest('input[data-ren-input]'); if (!inp) return
    if (ev.key === 'Enter') { ev.preventDefault(); savedRenameCommit(inp.dataset.renInput) }
    else if (ev.key === 'Escape') { SAVED_UI.renaming = null; savedViewRender() }
  })
}

// Show the Saved view, optionally scrolled to one card (the "View" button after a save).
function savedShow(uid) {
  SAVED_UI.focus = uid || null
  if (uid) { const r = savedStoreFind(uid); if (r && savedFilter([r], SAVED_UI.filter).length === 0) SAVED_UI.filter = [] }
  appSetPage('saved')
}


// ---- src/ui/gauges.js ----
// The gauge cards: FEASIBILITY (arc dial + score histogram + script mix) and UNIQUENESS (continuous copies
// meter with the engine's field comparison). No EV card: the page models no contest winnings (Adam, 2026-10-13).
// Inline SVG and CSS only.
// Every number shown comes from the engine's analysis; nothing here invents a component the engine does not expose.

// D19 salary left. A TwoGunGPT range in words: "$600 or less", "$700–$1,900", "$2,000+".
function rangeLabel(r) { return r.min == null ? `${money(r.max)} or less` : r.max == null ? `${money(r.min)}+` : `${money(r.min)}–${money(r.max)}` }
// Off (default): plain information, TwoGun's share for this lineup's range; no effect on copies.
// Smooth: the page's own estimate of the field share leaving within $300 of this lineup (italic, D7).
function salaryRow(u) {
  const r = u.salaryRange
  if (u.salaryLeftModel === 'smooth' && u.salaryNearShare != null) {
    const tip = `Salary unspent. Italic: this page's own ESTIMATE, not a TwoGunGPT number: the share of the simulated field leaving within $300 of ${money(u.salaryLeft)}. The field gives each extra $1,000 left a smooth, fitted penalty (D19).`
    return row('Salary left', money(u.salaryLeft), tip, `<span class="est">${Math.round(u.salaryNearShare)}% of field within $300</span>`)
  }
  const tip = `Salary unspent.${r ? ` TwoGunGPT's study of real showdowns: ${r.pct}% of lineups leave ${rangeLabel(r)}.` : ''} Shown for information only: salary left is not applied to the simulated field (D19), so it does not change expected copies.`
  return row('Salary left', money(u.salaryLeft), tip, r ? `TwoGun: ${r.pct}% leave ${rangeLabel(r)}` : '')
}
function salaryWork(u) {
  const rs = u.salaryRanges || []
  const pub = rs.map(r => `${rangeLabel(r)} ${Math.round(r.target)}%`).join(' · ')
  const fld = rs.map(r => `${Math.round(r.achieved)}%`).join(' · ')
  if (u.salaryLeftModel === 'smooth') return `Salary left ${money(u.salaryLeft)}: smooth rule, each $1,000 left multiplies a lineup's field weight by ${Math.exp(-(u.salarySlope || 0)).toFixed(2)} (D19); ${u.salaryNearShare != null ? `${u.salaryNearShare.toFixed(1)}% of the field leaves within $300 (page's estimate)` : ''}${pub ? `; TwoGun ${pub}; this field ${fld} (estimate)` : ''}`
  return `Salary left ${money(u.salaryLeft)}: the salary-left habit is not applied to the field (D19), so it does not change copies${pub ? `. TwoGun's real showdown lineups: ${pub}; this page's field leaves ${fld} (estimate)` : ''}`
}

function verdictClass(v) { return v === 'DEAD' ? 'DEAD' : v === 'REALISTIC' ? 'REAL' : 'LONG' }

// Arc dial: pFirst on a log scale. 1-in-1,000,000 (or never) is the far left; 1-in-10 the far right.
function dialSvg(pFirst, verdict) {
  const t = pFirst > 0 ? Math.max(0, Math.min(1, 1 - (Math.log10(1 / pFirst) - 1) / 5)) : 0
  const cx = 70, cy = 58, r = 48
  const pt = a => [cx + r * Math.cos(Math.PI * (1 - a)), cy - r * Math.sin(Math.PI * (1 - a))]
  const arc = (a0, a1, color, w) => { const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${color}" stroke-width="${w}" fill="none"/>` }
  const [nx, ny] = [cx + (r - 2) * Math.cos(Math.PI * (1 - t)), cy - (r - 2) * Math.sin(Math.PI * (1 - t))]
  const col = verdict === 'DEAD' ? 'var(--red-text)' : verdict === 'REALISTIC' ? 'var(--green-text)' : 'var(--gold)'
  return `<svg viewBox="0 0 140 66" class="dial" aria-label="Chance of first place">
<defs><linearGradient id="dialg" x1="0" x2="1"><stop offset="0" stop-color="#b23a3a"/><stop offset=".5" stop-color="#f0b429"/><stop offset="1" stop-color="#2f8f5b"/></linearGradient></defs>
${arc(0.001, 0.999, 'url(#dialg)', 10)}
<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round" class="needle"/>
<circle cx="${cx}" cy="${cy}" r="4.5" fill="${col}"/>
<text x="6" y="64" font-size="8" fill="var(--dim)">never</text><text x="134" y="64" font-size="8" fill="var(--dim)" text-anchor="end">1 in 10</text>
</svg>`
}

// Histogram: lineup score distribution (blue) against the winning score (gold); each series scaled to its own peak.
function histSvg(hist) {
  if (!hist || !hist.bins || !hist.bins.length) return ''
  const n = hist.bins.length, W = 240, H = 44, bw = W / n
  const norm = arr => { const m = Math.max(...arr, 1e-9); return arr.map(v => v / m) }
  const bars = (arr, color, op) => norm(arr).map((v, i) => `<rect x="${(i * bw + 0.3).toFixed(1)}" y="${(H - v * (H - 2)).toFixed(1)}" width="${(bw - 0.6).toFixed(1)}" height="${(v * (H - 2)).toFixed(1)}" fill="${color}" opacity="${op}"/>`).join('')
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="hist" aria-label="Lineup score vs winning score">${bars(hist.winning, 'var(--hist-win)', 0.6)}${bars(hist.lineup, 'var(--hist-lineup)', 0.85)}</svg>`
}

// Continuous copies colour: cool (green-blue) under 1, warming through about 20 and beyond, on a log scale.
function copiesHue(c) { const t = Math.max(0, Math.min(1, Math.log10(Math.max(0.1, c) / 0.3) / Math.log10(40 / 0.3))); return `hsl(${Math.round(190 - 190 * t)}, 72%, ${Math.round(58 - 6 * t)}%)` }

// Copies meter: a log scale from 0.1 to 100 with a smooth gradient and a marker; tiny lineup tickets lit per copy.
function copiesMeter(copies) {
  const W = 240, H = 46
  const pos = c => Math.max(0, Math.min(1, Math.log10(Math.max(0.1, c) / 0.1) / 3))
  let out = `<defs><linearGradient id="cpg" x1="0" x2="1"><stop offset="0" stop-color="hsl(190,72%,58%)"/><stop offset=".33" stop-color="hsl(130,60%,52%)"/><stop offset=".66" stop-color="hsl(45,90%,55%)"/><stop offset="1" stop-color="hsl(0,70%,52%)"/></linearGradient></defs>`
  out += `<rect x="0" y="30" width="${W}" height="9" rx="4" fill="url(#cpg)" opacity=".8"/>`
  for (const [c, l] of [[0.1, '0.1'], [1, '1'], [10, '10'], [100, '100+']]) out += `<text x="${(pos(c) * W).toFixed(1)}" y="46" font-size="8" fill="var(--muted)" text-anchor="${c === 0.1 ? 'start' : c === 100 ? 'end' : 'middle'}">${l}</text>`
  const heat = copiesHue(copies)
  const lit = Math.min(10, Math.round(copies))
  for (let i = 0; i < 10; i++) out += `<rect x="${i * 13 + 2}" y="4" width="10" height="16" rx="2" fill="${i < lit ? heat : 'var(--surface-2)'}" stroke="${i < lit ? heat : 'var(--border)'}"/><rect x="${i * 13 + 4}" y="8" width="6" height="2" fill="${i < lit ? 'var(--bg)' : 'var(--border)'}"/><rect x="${i * 13 + 4}" y="12" width="6" height="2" fill="${i < lit ? 'var(--bg)' : 'var(--border)'}"/>`
  if (copies > 10.5) out += `<text x="136" y="17" font-size="10" fill="${heat}">+${Math.round(copies - 10)}</text>`
  const mx = pos(copies) * W
  out += `<polygon points="${(mx - 5).toFixed(1)},23 ${(mx + 5).toFixed(1)},23 ${mx.toFixed(1)},30" fill="${heat}"/><line x1="${mx.toFixed(1)}" y1="30" x2="${mx.toFixed(1)}" y2="39" stroke="var(--text)" stroke-width="2"/>`
  return `<svg viewBox="0 0 ${W} ${H}" class="meter" aria-label="Expected copies">${out}</svg>`
}

// Script mix: one stacked bar of this lineup's wins by script.
function scriptMixBar(scripts) {
  if (!scripts || !scripts.length) return ''
  const cols = ['#5ea9f0', '#f0b429', '#4fc47f', '#e06c6c', '#a78bfa', '#f0a2d8']
  let x = 0
  const segs = scripts.map((s, i) => { const sh = s.lineupWinShare > 1 ? s.lineupWinShare / 100 : (s.lineupWinShare || 0); const w = sh * 240; const r = `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0, w - 0.5).toFixed(1)}" height="10" fill="${cols[i % 6]}"><title>${esc(s.name)}: ${Math.round(sh * 100)}% of wins</title></rect>`; x += w; return r }).join('')
  return `<svg viewBox="0 0 240 10" preserveAspectRatio="none" class="mix" aria-label="Wins by script">${segs}</svg>`
}

function gaugeShell(id, title, accent, body) { return `<div class="card gauge ${accent}" id="g-${id}"><h2>${title}</h2>${body}</div>` }
function row(k, v, tip, extra) { return `<div class="r" title="${esc(tip)}"><span class="k">${k}</span><span class="v">${v}${extra ? `<small>${extra}</small>` : ''}</span></div>` }
function workHtml(lines) { return `<details class="work"><summary>show the working</summary><div>${lines.map(l => `<div class="wl">${l}</div>`).join('')}</div></details>` }

function gaugesWaiting(text) {
  return ['feas', 'uniq'].map((id, i) => gaugeShell(id, ['Feasibility', 'Uniqueness'][i], ['acc-feas', 'acc-uniq'][i], `<div class="wait">${esc(text)}</div>`)).join('')
}

// Delta chips: show how each headline moved since the previous analysis, for about two seconds.
function deltaChip(key, val, fmt) {
  const prev = S.prevHead[key]
  S.prevHead[key] = val
  if (prev == null || prev === val || !isFinite(prev)) return ''
  const d = val - prev
  return `<span class="dchip ${cls(key === 'copies' ? -d : d)}">${fmt(d)}</span>`
}

function renderGauges(a, v) {
  const el = document.getElementById('gauges')
  if (!S.ready) { el.innerHTML = gaugesWaiting('Warming up: ' + (S.progressNote || 'building the model')); return }
  if (!v.ok || !a) { el.innerHTML = gaugesWaiting(lineupIds().length ? 'Fix the lineup to see the gauges: ' + v.errors.join(', ') : 'Build a lineup to see the gauges'); return }
  const f = a.feasibility, u = a.uniqueness
  const C = S.contest
  const vc = verdictClass(f.verdict)
  const share = s => s.lineupWinShare > 1 ? s.lineupWinShare / 100 : (s.lineupWinShare || 0)
  const topScripts = (f.scripts || []).slice().sort((x, y) => share(y) - share(x)).slice(0, 2)
  const sims = S.sims || 10000
  const wins = Math.round(f.pFirst * sims)
  // Under 2 expected wins in the sims the Wilson band's upper end is just z^2/(sims+z^2) (about 1 in
  // 3,700 at 10,000 sims), which misleads beside a par of 1 in 118,900: no band, say the resolution instead.
  const unresolved = f.pFirst * sims < 2
  const ci = !unresolved && f.winsCI && f.winsCI.hi != null ? f.winsCI : null
  const par = C && C.size ? 1 / (C.size + 1) : null
  // Big contests (C.subsampled): pFirst is the exact field mass above the lineup, a fraction, not a count of sims won.
  const exact = !!(C && C.subsampled)
  const noisy = firstTooRare(f.pFirst, sims)   // the same test as the takeaways and saved cards (fmt.js)
  const ciTxt = ci ? ` 90% band: ${pctRange(ci.lo, ci.hi)}.` : unresolved ? ` The sims can't resolve odds longer than about 1 in ${Math.round(sims / 2.7).toLocaleString('en-US')}.` : ''
  const parTxt = par ? ` · par ${oneIn(par)}${f.pFirst > 0 ? ` · ${f.pFirst >= par ? (f.pFirst / par).toFixed(1) + 'x par' : (par / f.pFirst).toFixed(1) + 'x below par'}` : ''}` : ''
  const headCol = vc === 'DEAD' ? 'bad' : vc === 'REAL' ? 'good' : 'gold'
  const feasHead = noisy
    ? `<div class="l1"><span class="big ${headCol}" title="${TIP.pTop1}">${pct(f.pTop1pct, 1)}</span><span class="unit">top 1% of games · par 1%</span></div><div class="verdict ${vc}" title="First place is too rare to measure in ${sims.toLocaleString('en-US')} sims: P(first) ${f.pFirst > 0 ? pct(f.pFirst, 2) : '0'}.${ciTxt}">${esc(f.verdict)} · first too rare to measure</div>`
    : `<div class="l1"><span class="big ${headCol}" title="${TIP.pFirst}${ciTxt}${exact ? ' Exact field mass above this lineup in each sim.' : ` ${wins} of ${sims.toLocaleString('en-US')} sims.`}">${oneIn(f.pFirst)}</span><span class="unit">wins first</span>${deltaChip('pFirst', f.pFirst, d => (d > 0 ? '+' : '−') + pct(Math.abs(d), 2))}</div><div class="verdict ${vc}" title="${ciTxt}">${esc(f.verdict)}${parTxt}</div>`
  const feas = `
<div class="head">${feasHead}</div>
<div class="dialwrap" title="${TIP.pFirst}">${dialSvg(f.pFirst, f.verdict)}</div>
<div class="rows">
${row('P(first)', pct(f.pFirst, 2), TIP.pFirst + ciTxt, par ? `par ${pct(par, 3)}` : '')}
${row('P(top 1%)', pct(f.pTop1pct), TIP.pTop1)}
${row('Median score', f.pctl.p50.toFixed(1), TIP.pctl, `p10 ${f.pctl.p10.toFixed(0)} · p90 ${f.pctl.p90.toFixed(0)}`)}
</div>
<div class="chart" title="Blue: this lineup's score over the simulated games. Gold: the score that won each simulated contest.">${histSvg(f.hist)}</div>
<div class="legend"><span><i style="background:var(--hist-lineup)"></i>this lineup</span><span><i style="background:var(--hist-win)"></i>winning score</span></div>
<div class="chart mixwrap" title="Which scripts this lineup's wins come in">${scriptMixBar(f.scripts)}</div>
<div class="legend">${topScripts.map((s, i) => `<span><i style="background:${['#5ea9f0', '#f0b429', '#4fc47f', '#e06c6c', '#a78bfa', '#f0a2d8'][(f.scripts || []).indexOf(s) % 6]}"></i>${esc(s.name)} ${Math.round(share(s) * 100)}%</span>`).join('')}</div>
<div class="note">${esc(f.verdictReason || '')}</div>
${workHtml([
    exact ? `Win rate: P(first) ${pct(f.pFirst, 2)} = ${oneIn(f.pFirst)}, the exact field mass above this lineup in each of ${sims.toLocaleString('en-US')} sims.${ciTxt}${par ? ` Par for ${C.size.toLocaleString('en-US')} entries is ${pct(par, 3)}.` : ''}` : `Win rate: ${wins} first-place finish${wins === 1 ? '' : 'es'} in ${sims.toLocaleString('en-US')} simulated contests = ${pct(f.pFirst, 2)}.${ciTxt}${par ? ` Par for ${C.size.toLocaleString('en-US')} entries is ${pct(par, 3)}.` : ''}`,
    ...(f.scripts || []).map(s => `${esc(s.name)}: ${Math.round(share(s) * 100)}% of its wins; script odds ${Math.round(s.odds)}%; avg score ${s.avgScore != null ? s.avgScore.toFixed(1) : '–'}`),
    `Verdict rule: DEAD = never first; LONG SHOT ALIVE = wins rarely but in a coherent script; REALISTIC otherwise (engine's call)`
  ])}`

  // Missing is missing: name who in this lineup has no ownership posted for his slot (the field never plays him there).
  const unposted = Array.isArray(u.unposted) ? u.unposted : []
  const unpostedTxt = unposted.length ? `No TwoGunGPT ownership posted for ${unposted.map(x => `${x.name} at ${x.slot === 'cpt' ? 'Captain' : 'FLEX'}`).join(', ')}: the simulated field never plays ${unposted.length === 1 ? 'him' : 'them'} there, so this lineup has no copies.` : ''
  // The field fit stated honestly (never hidden): the worst ownership and team-split misses.
  const fr = S.host && S.host.fitReport && S.host.fitReport.fit
  const fitTxt = fr ? (fr.exact ? `The field misses TwoGunGPT's posted ownership by up to ${fr.ownershipMissPoints.toFixed(1)} points (the pro-rata scaling) and his team splits by up to ${fr.splitMissPoints.toFixed(1)} points.` : `TwoGunGPT's team splits and his player ownership cannot both be met exactly: the field misses his posted ownership by up to ${fr.ownershipMissPoints.toFixed(1)} points and his team splits by up to ${fr.splitMissPoints.toFixed(1)} points.`) : ''
  const heat = copiesHue(u.expectedCopies)
  const cmp = u.copiesPercentileVsField != null ? `fewer copies than ${Math.round(u.copiesPercentileVsField)}% of the field` : null
  const uniq = `
<div class="head"><div class="l1"><span class="big" style="color:${heat}" title="${TIP.copies}">${u.expectedCopies.toFixed(u.expectedCopies < 10 ? 2 : u.expectedCopies < 100 ? 1 : 0)}</span><span class="unit">expected copies</span>${deltaChip('copies', u.expectedCopies, d => signed(d, 2))}</div><div class="verdict" style="color:${heat}">${cmp ? esc(cmp) : `a win would split about ${(1 + u.expectedCopies).toFixed(1)} ways`}</div></div>
<div class="chart" title="${TIP.copies}">${copiesMeter(u.expectedCopies)}</div>
<div class="rows">
${row('A win splits', `${(1 + u.expectedCopies).toFixed(1)} ways`, 'You plus the expected copies share first place.')}
${row('P(no copies)', pct(u.pZeroCopies, 0), TIP.pZero)}
${row('Near twins', u.nearTwins.toFixed(1), TIP.twins)}
${salaryRow(u)}
</div>
<div class="note ${u.warning ? 'warn' : ''}">${esc(u.warning || (cmp ? `Expected copies in a ${C ? C.size.toLocaleString('en-US') : ''}-entry field; same field habits at every size.` : 'Unique AND alive is the goal.'))}</div>
${unpostedTxt ? `<div class="note warn">${esc(unpostedTxt)}</div>` : ''}
${workHtml([
    u.probability != null ? `P(lineup) = ${(u.probability * 1e6).toFixed(1)} per 1M field lineups` : 'P(lineup): not exposed by the engine',
    u.probability != null && C ? `× field size ${C.size.toLocaleString('en-US')} = ${u.expectedCopies.toFixed(2)} expected copies` : `expected copies ${u.expectedCopies.toFixed(2)}`,
    `P(no copies) = ${pct(u.pZeroCopies, 1)}; near twins (one swap away) = ${u.nearTwins.toFixed(2)}`,
    u.ownershipProduct != null ? `ownership product of the six (TwoGunGPT's posted figures) = ${(u.ownershipProduct * 1e6).toFixed(2)} per million` : 'ownership product of the six: none (TwoGunGPT posted no ownership for one of them in his slot)',
    cmp ? `${cmp} (engine's field sample)` : '',
    fitTxt,
    salaryWork(u)
  ].filter(Boolean))}`

  el.innerHTML = gaugeShell('feas', 'Feasibility', 'acc-feas', feas) + gaugeShell('uniq', 'Uniqueness', 'acc-uniq', uniq)
  el.querySelectorAll('.dchip').forEach(c => setTimeout(() => c.classList.add('fade'), 2000))
}


// ---- src/ui/lower.js ----
// Below the gauges: script tiles, "what has to happen", and the swap explorer.

function scriptTilesHtml(scripts) {
  if (!scripts || !scripts.length) return '<div class="none">No script data</div>'
  const sh = s => (s.lineupWinShare > 1 ? s.lineupWinShare / 100 : (s.lineupWinShare || 0)) * 100
  const max = Math.max(...scripts.map(sh), 1)
  return scripts.map(s => {
    const share = sh(s)
    const heat = Math.pow(share / max, 0.8)
    return `<div class="tile" style="--heat:${heat.toFixed(2)}" title="${esc(s.name)}: TwoGunGPT gives it ${s.odds}% odds. ${share.toFixed(0)}% of this lineup's simulated wins happened in this script (avg score ${s.avgScore != null ? s.avgScore.toFixed(1) : '–'}).${s.note ? ' ' + esc(s.note) : ''}">
<div class="tn">${esc(s.name)}</div>
<div class="ts"><span class="share">${share.toFixed(0)}%</span><span class="of">of wins</span></div>
<div class="to"><span title="${TIP.scriptOdds}">odds ${s.odds}%</span><span title="${TIP.scriptAvg}">avg ${s.avgScore != null ? s.avgScore.toFixed(0) : '–'}</span></div>
</div>`
  }).join('')
}

function needsHtml(list) {
  if (!list || !list.length) return '<tr class="empty"><td colspan="3">Nothing yet</td></tr>'
  const { key, dir } = S.needsSort
  list = list.slice().sort((a, b) => { const va = key === 'name' ? (S.byId.get(a.id) || {}).name || '' : a[key], vb = key === 'name' ? (S.byId.get(b.id) || {}).name || '' : b[key]; return (va < vb ? -1 : va > vb ? 1 : 0) * dir })
  return list.map(w => {
    const p = S.byId.get(w.id); if (!p) return ''
    const top = 100 - w.pctlOfThat
    const col = top <= 5 ? 'bad' : top <= 20 ? 'gold' : 'good'
    return `<tr title="${TIP.needs}"><td><b>${esc(p.name)}</b><span class="mu">${teamTag(p)}${w.slot === 'cpt' ? ' · CPT' : ''}</span></td><td>${w.avgWhenWinning.toFixed(1)}<span class="mu">pts</span></td><td class="${col}">top ${top.toFixed(0)}%</td></tr>`
  }).join('')
}

function renderLower(a) {
  const tiles = document.getElementById('tiles')
  const needs = document.getElementById('needs')
  if (!a) {
    tiles.innerHTML = (S.snapshot.scripts || []).map(s => `<div class="tile off" style="--heat:0" title="TwoGunGPT gives this script ${s.odds}% odds"><div class="tn">${esc(s.name)}</div><div class="ts"><span class="share dim">–</span></div><div class="to"><span>odds ${s.odds}%</span></div></div>`).join('')
    needs.innerHTML = `<tr class="empty"><td colspan="3">${!S.ready ? 'Warming up' : 'Build a legal lineup to see what each player must do in the games it wins'}</td></tr>`
    return
  }
  tiles.innerHTML = scriptTilesHtml(a.feasibility.scripts)
  needs.innerHTML = needsHtml(a.feasibility.whatHasToHappen)
  document.querySelectorAll('#needs-head th').forEach(th => { th.classList.toggle('on', th.dataset.key === S.needsSort.key); th.querySelector('.arr').textContent = th.dataset.key === S.needsSort.key ? (S.needsSort.dir > 0 ? '▲' : '▼') : '' })
}

function swapOptHtml(slot, o) {
  const p = S.byId.get(o.id); if (!p) return ''
  // the swap explorer reads the change in the top-1% rate
  const base = S.analysis && S.analysis.feasibility ? S.analysis.feasibility.pTop1pct : null
  return `<button class="opt" data-slot="${slot}" data-id="${o.id}" title="Swap in ${esc(p.name)}: ${top1FromTo(base, o)}; copies ${signed(o.deltaCopies, 2)}; salary ${signedMoney(o.deltaSalary)}${o.approx ? '; approximate in this contest size' : ''}">
<span class="n"><b>${esc(p.name)}</b><span class="mu">${teamTag(p)}</span></span>
<span class="d ev ${cls(o.deltaTop1pct)}" title="${TIP.dTop1} ${top1FromTo(base, o)}.">${top1Pts(o.deltaTop1pct)}</span>
<span class="d ${cls(-o.deltaCopies)}" title="${TIP.dCopies}">${signed(o.deltaCopies, 1)}</span>
<span class="d muted" title="${TIP.dSal}">${signedMoney(o.deltaSalary)}</span></button>`
}

function renderSwaps(a) {
  const el = document.getElementById('swap-grid')
  const slots = ['cpt', 0, 1, 2, 3, 4]
  el.innerHTML = slots.map(slot => {
    const curId = slot === 'cpt' ? S.lineup.cpt : S.lineup.flex[slot]
    const cur = curId && S.byId.get(curId)
    const s = a && a.swaps && a.swaps.find(x => String(x.slot) === String(slot))
    const head = `<h3 class="${slot === 'cpt' ? 'cpt' : ''}">${slot === 'cpt' ? 'CPT' : 'FLEX ' + (slot + 1)}<span class="cur">${cur ? esc(cur.name) : '<span class="dim">empty</span>'}</span></h3>`
    const { key, dir } = S.swapSort
    const opts = s ? s.options.filter(o => o.legal !== false).slice().sort((x, y) => (x[key] - y[key]) * dir) : []
    const body = !a ? '<div class="none">Needs a legal lineup</div>' : !opts.length ? '<div class="none">No legal swap for this slot</div>' : opts.slice(0, 8).map(o => swapOptHtml(slot, o)).join('')
    return `<div class="col">${head}${body}</div>`
  }).join('')
}

function needsCardHtml() {
  return `<div class="card needs"><h2>What has to happen <span class="right">in the games this lineup wins</span></h2><table class="t sortable"><thead id="needs-head"><tr><th data-key="name">Player<span class="arr"></span></th><th data-key="avgWhenWinning" title="${TIP.needs}">Needs about<span class="arr"></span></th><th data-key="pctlOfThat" title="${TIP.needs}">His game<span class="arr"></span></th></tr></thead><tbody id="needs"></tbody></table></div>`
}
function lowerHtml() {

<div class="card"><h2>Game scripts <span class="right">tile heat = share of this lineup's wins</span></h2><div class="tiles" id="tiles"></div></div>

// ---- src/ui/takeaways.js ----
// "What this means": two to four plain-English bullets, RULE-BASED from the engine's numbers.
// Every threshold lives in TAKEAWAY_RULES and is RELATIVE to the field (a percentile, or a multiple of par,
// where par = 1 / (field size + 1)); never an absolute count. No bullet is written without the number behind it,
// and the copies bullet repeats the Uniqueness card's own numbers so the two can never disagree.

const TAKEAWAY_RULES = {
  copiesPctlGood: 60,       // fewer copies than this % of the field: coloured green
  copiesPctlBad: 30,        // fewer copies than fewer than this % of the field: coloured red (chalkier than most)
  scriptDominant: 0.6,      // one script holds this share of wins or more: "lives on one script"
  swapWorth: 0,             // a swap must raise the top-1% rate (any gain; both are scored on the same simulated games) to be suggested
  needsTop: 5,              // a player must hit his top X% or better: "needs a nuke game"
  ciWide: 10                // documents firstTooRare (fmt.js): winsCI hi/lo above this (or pFirst under 1/(10 x sims)) is too noisy to lead with
}

function takeawayBullets(a, v) {
  const R = TAKEAWAY_RULES
  const f = a.feasibility, u = a.uniqueness
  const out = []
  const C = S.contest
  const par = C && C.size ? 1 / (C.size + 1) : null

  // 1. Copies: the Uniqueness card's own numbers.
  const cp = u.copiesPercentileVsField
  const cpCls = cp == null ? 'gold' : cp >= R.copiesPctlGood ? 'good' : cp < R.copiesPctlBad ? 'bad' : 'gold'
  out.push({ cls: cpCls, text: `About ${u.expectedCopies < 10 ? u.expectedCopies.toFixed(1) : Math.round(u.expectedCopies)} copies (a win splits ${(1 + u.expectedCopies).toFixed(1)} ways)` + (cp != null ? `; fewer copies than ${Math.round(cp)}% of this field.` : '.'), target: 'g-uniq' })

  // 2. Dead: the DEAD rule allows a win: "never" only when the sims hold none (under half a win), else the rule's own bound
  const deadSims = S.sims || 10000
  if (f.verdict === 'DEAD') out.push({ cls: 'bad', text: `Dead: ${f.pFirst * deadSims < 0.5 ? `it never finished first in ${deadSims.toLocaleString('en-US')} sims` : 'it almost never finished first (under 2 wins per 10,000 sims)'}${u.warning ? '; unique only because nobody plays a lineup that cannot win' : ''}.`, target: 'g-feas' })

  // 3. Win rate against par, only when the simulations resolve it.
  const sims = S.sims || 10000
  // Under 2 expected wins the Wilson band is meaningless (its top is about z^2/(sims+z^2)): no band, state the resolution.
  const unresolved = f.pFirst * sims < 2
  const noisy = firstTooRare(f.pFirst, sims)   // shared with both gauges (fmt.js); its 10x is R.ciWide
  if (f.verdict !== 'DEAD' && par) {
    if (noisy) out.push({ cls: 'gold', text: `First place is too rare to measure in ${sims.toLocaleString('en-US')} sims${unresolved ? ` (they can't resolve odds longer than about 1 in ${Math.round(sims / 2.7).toLocaleString('en-US')})` : ''}; it reaches the top 1% in ${pct(f.pTop1pct, 1)} of games (par 1%).`, target: 'g-feas' })
    else out.push({ cls: f.pFirst >= par ? 'good' : 'gold', text: `Wins first ${oneIn(f.pFirst)} (par for this field ${oneIn(par)}), ${f.pFirst >= par ? (f.pFirst / par).toFixed(1) + 'x par' : (par / f.pFirst).toFixed(1) + 'x below par'}.`, target: 'g-feas' })
  }

  // 4. Script dependence.
  const sc = (f.scripts || []).slice().sort((x, y) => (y.lineupWinShare || 0) - (x.lineupWinShare || 0))[0]
  if (sc && f.verdict !== 'DEAD') {
    const share = sc.lineupWinShare > 1 ? sc.lineupWinShare / 100 : sc.lineupWinShare
    if (share >= R.scriptDominant) out.push({ cls: 'gold', text: `Lives on one script: ${Math.round(share * 100)}% of its wins come in "${sc.name}" (odds ${Math.round(sc.odds)}%).`, target: 'tiles' })
  }

  // 5. Hardest requirement.
  const need = (f.whatHasToHappen || []).slice().sort((x, y) => y.pctlOfThat - x.pctlOfThat)[0]
  if (need && f.verdict !== 'DEAD' && 100 - need.pctlOfThat <= R.needsTop) {
    const p = S.byId.get(need.id)
    if (p) out.push({ cls: 'gold', text: `Needs a nuke game: ${p.name} averages ${need.avgWhenWinning.toFixed(0)} points ${f.basis === 'wins' ? 'when it wins' : 'in its best games'}, his top ${Math.max(1, Math.round(100 - need.pctlOfThat))}% game.`, target: 'needs' })
  }

  // 6. Best single swap.
  let best = null
  // ranked and read on the change in the top-1% rate
  for (const s of a.swaps || []) for (const o of s.options || []) if (o.legal !== false && (!best || o.deltaTop1pct > best.o.deltaTop1pct)) best = { slot: s.slot, o }
  if (best && best.o.deltaTop1pct > R.swapWorth) {
    const cur = S.byId.get(best.slot === 'cpt' ? S.lineup.cpt : S.lineup.flex[best.slot]), nw = S.byId.get(best.o.id)
    if (cur && nw) out.push({ cls: 'blue', text: `Best fix: ${lastName(cur.name)} → ${lastName(nw.name)}${best.slot === 'cpt' ? ' at CPT' : ''}: ${top1FromTo(f.pTop1pct, best.o)} (${top1Pts(best.o.deltaTop1pct)}), ${signed(best.o.deltaCopies, 1)} copies, ${signedMoney(best.o.deltaSalary)} salary${best.o.approx ? ' (approx.)' : ''}.`, swap: best })
  }
  return out.slice(0, 4)
}

function renderTakeaways(a, v) {
  const el = document.getElementById('takeaways')
  if (!S.ready) { el.innerHTML = `<div class="tk wait">Warming up: the read of your lineup appears once the model is built.</div>`; return }
  if (!a || !v.ok) { el.innerHTML = `<div class="tk wait">${lineupIds().length ? 'Finish a legal lineup to get a plain-English read.' : 'Add six players: you get a plain-English read of the lineup here.'}</div>`; return }
  const bullets = takeawayBullets(a, v)
  el.innerHTML = `<h2>What this means <span class="right">click a line to jump to it</span></h2><ul>` + bullets.map((b, i) =>
    `<li class="${b.cls}" data-i="${i}" ${b.target ? `data-target="${b.target}"` : ''} title="${b.swap ? 'Click to apply this swap' : 'Click to jump to the card this refers to'}"><i></i><span>${esc(b.text)}</span></li>`).join('') + '</ul>'
  el._bullets = bullets
}

function bindTakeaways() {
  document.getElementById('takeaways').addEventListener('click', ev => {
    const li = ev.target.closest('li'); if (!li) return
    const b = document.getElementById('takeaways')._bullets[+li.dataset.i]; if (!b) return
    if (b.swap) { applySwap(b.swap.slot, b.swap.o.id); return }
    const t = document.getElementById(b.target); if (!t) return
    t.scrollIntoView({ behavior: 'smooth', block: 'center' })
    t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1200)
  })
}


// ---- src/ui/refresh.js ----
// Refresh from TwoGunGPT through the artifact `mcp` capability (server "TwoGunFF"). Ruling D9: hit it gently.
// Only on a press; one call at a time with >= 1.5 s between calls; never retried; disabled 10 minutes after a press
// (30 minutes after a rate-limit error). Opened from disk (no capability) the button stays visible but disabled.
// Tools called, in order: get_slates; then only if the board changed: get_projections, get_game, get_player (per player).

const REFRESH_SERVER = 'TwoGunFF'
const REFRESH_GAP_MS = 1500
const REFRESH_COOLDOWN_MS = 10 * 60 * 1000
const REFRESH_RATELIMIT_MS = 30 * 60 * 1000
const REFRESH_KEY = 'lineuplab-tgff.refresh.v1'

function refreshState() { try { return JSON.parse(localStorage.getItem(REFRESH_KEY) || '{}') } catch (e) { return {} } }
function refreshStore(st) { try { localStorage.setItem(REFRESH_KEY, JSON.stringify(st)) } catch (e) { /* storage blocked */ } }
function refreshLockedUntil() { const st = refreshState(); return Math.max(st.cooldownUntil || 0, st.rateLimitUntil || 0) }

async function refreshMcp() {
  try {
    if (typeof window === 'undefined' || !window.claude || typeof window.claude.use !== 'function') return null
    return await window.claude.use('mcp')
  } catch (e) { return null }
}

const sleep = ms => new Promise(r => setTimeout(r, ms))

// One paced call. Any rejection stops the whole refresh (the caller catches); nothing here retries.
async function refreshCall(mcp, tool, input, pace) {
  const wait = pace.last ? REFRESH_GAP_MS - (Date.now() - pace.last) : 0
  if (wait > 0) await sleep(wait)
  pace.last = Date.now()
  const res = await mcp.callTool(REFRESH_SERVER, tool, input || {}, { cache: false })
  return res && res.payload !== undefined ? res.payload : res
}

function need(obj, path, what) {
  const v = path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj)
  if (v === undefined || v === null) throw new Error(`Refresh stopped: ${what} is missing "${path}" in the connector result; keeping the saved data.`)
  return v
}
const pick = (o, keys) => { for (const k of keys) if (o && o[k] != null) return o[k]; return undefined }
const num = x => { const n = typeof x === 'string' ? parseFloat(x.replace(/[$,%]/g, '')) : Number(x); return Number.isFinite(n) ? n : undefined }

// Map one connector player line onto the snapshot player (keeps published ownership; the connector has none).
function mapPlayerLine(cur, line, full) {
  const out = Object.assign({}, cur)
  const salary = num(pick(line, ['salary', 'dk_salary']))
  if (salary === undefined) throw new Error(`Refresh stopped: no salary for ${cur.name}; keeping the saved data.`)
  out.salary = salary; out.cptSalary = Math.round(salary * 1.5)
  for (const [k, keys] of [['projection', ['projection', 'proj', 'avg']], ['median', ['median']], ['ceiling', ['ceiling']], ['nuke', ['nuke']], ['sd', ['sd', 'stdev']], ['p3x', ['p3x', 'odds_3x']], ['p4x', ['p4x', 'odds_4x']]]) {
    const v = num(pick(full || {}, keys) ?? pick(line, keys)); if (v !== undefined) out[k] = v
  }
  if (out.median === undefined || out.ceiling === undefined || out.nuke === undefined) throw new Error(`Refresh stopped: median/ceiling/nuke missing for ${cur.name}; keeping the saved data.`)
  const ladder = pick(full || {}, ['pctl', 'percentiles', 'percentile_ladder', 'ladder'])
  if (ladder && typeof ladder === 'object') {
    const p = {}
    for (const k of Object.keys(ladder)) { const kk = String(k).replace(/^p/i, ''); const v = num(ladder[k]); if (v !== undefined) p[kk] = v }
    if (['10', '25', '50', '75', '90', '95'].every(k => p[k] !== undefined)) out.pctl = Object.assign({}, cur.pctl, p)
    else throw new Error(`Refresh stopped: percentile ladder incomplete for ${cur.name}; keeping the saved data.`)
  }
  const inj = pick(full || {}, ['injury', 'injury_call']) ?? pick(line, ['injury', 'injury_call'])
  if (inj && typeof inj === 'object') out.injury = { status: pick(inj, ['status']) || cur.injury?.status || 'Questionable', call: pick(inj, ['call', 'verdict']) || cur.injury?.call || 'PLAY', note: pick(inj, ['note', 'reason', 'text']) || '' }
  else if (typeof inj === 'string' && inj) out.injury = { status: cur.injury?.status || 'Questionable', call: /out/i.test(inj) ? 'OUT' : 'PLAY', note: inj }
  const exp = pick(full || {}, ['expectedLine', 'expected_line', 'expected_stats']); if (exp && typeof exp === 'object') out.expectedLine = exp
  const cw = pick(full || {}, ['ceilingWorld', 'ceiling_world']); if (Array.isArray(cw)) out.ceilingWorld = cw.map(x => ({ player: pick(x, ['player', 'name']), team: x.team, pos: x.pos, pTop20WhenBooms: num(pick(x, ['pTop20WhenBooms', 'p_top20_when_booms', 'top20_pct'])), medianWhenBooms: num(pick(x, ['medianWhenBooms', 'median_when_booms'])), ceilingWhenBooms: num(pick(x, ['ceilingWhenBooms', 'ceiling_when_booms'])) }))
  const st = pick(full || {}, ['stacks', 'best_stacks']); if (Array.isArray(st)) out.stacks = st.map(x => ({ with: pick(x, ['with', 'player', 'name']), pBothTop20: num(pick(x, ['pBothTop20', 'p_both_top20', 'both_top20_pct'])), lift: num(x.lift), correlation: num(pick(x, ['correlation', 'corr'])) }))
  return out
}

function findLine(rows, p) {
  const n = p.name.toLowerCase()
  return rows.find(r => String(pick(r, ['name', 'player']) || '').toLowerCase() === n) || rows.find(r => String(pick(r, ['name', 'player']) || '').toLowerCase().includes(n.split(' ').pop()) && String(r.team || '').toUpperCase() === p.team)
}

// refreshSnapshot(current, onProgress) -> { snapshot, changes } or { unchanged: true, boardUpdated }
async function refreshSnapshot(current, onProgress) {
  const mcp = await refreshMcp()
  if (!mcp) throw new Error('Refresh works in the Claude app version; this copy uses the saved TwoGunGPT data.')
  const pace = { last: 0 }
  onProgress('Checking the board…')
  const slates = await refreshCall(mcp, 'get_slates', {}, pace)
  const updated = pick(slates, ['last_updated', 'lastUpdated', 'board_updated', 'updated'])
  if (updated === undefined) throw new Error('Refresh stopped: get_slates gave no last_updated; keeping the saved data.')
  if (String(updated) === String(current.meta.boardUpdated)) return { unchanged: true, boardUpdated: updated }
  onProgress('Board changed; fetching projections…')
  const proj = await refreshCall(mcp, 'get_projections', { slate: 'mnf', limit: 200 }, pace)
  const rows = pick(proj, ['players', 'rows', 'projections']) || (Array.isArray(proj) ? proj : null)
  if (!Array.isArray(rows) || !rows.length) throw new Error('Refresh stopped: get_projections returned no player rows; keeping the saved data.')
  onProgress('Fetching the game line…')
  const game = await refreshCall(mcp, 'get_game', { game: current.meta.game }, pace)
  const meta = Object.assign({}, current.meta, { boardUpdated: String(updated), pulledAt: new Date().toISOString() })
  const spread = num(pick(game, ['spread', 'line'])); if (spread !== undefined) meta.spread = Math.abs(spread)
  const total = num(pick(game, ['total', 'over_under'])); if (total !== undefined) meta.total = total
  const implied = pick(game, ['implied', 'implied_totals']); if (implied && typeof implied === 'object') meta.implied = Object.assign({}, meta.implied, implied)
  const players = []
  const changes = []
  for (let i = 0; i < current.players.length; i++) {
    const cur = current.players[i]
    onProgress(`${i + 1} of ${current.players.length}: ${cur.name}`)
    const line = findLine(rows, cur)
    const full = await refreshCall(mcp, 'get_player', { name: cur.name, slate: 'mnf' }, pace)
    const fullObj = pick(full, ['player']) || full
    if (!line && !fullObj) throw new Error(`Refresh stopped: ${cur.name} not found on the board; keeping the saved data.`)
    const nxt = mapPlayerLine(cur, line || {}, fullObj)
    if (nxt.median !== cur.median) changes.push(`${cur.name} median ${cur.median} → ${nxt.median}`)
    if ((nxt.injury && nxt.injury.call) !== (cur.injury && cur.injury.call)) changes.push(`${cur.name} injury call ${cur.injury ? cur.injury.call : 'none'} → ${nxt.injury ? nxt.injury.call : 'none'}`)
    players.push(nxt)
  }
  const snapshot = Object.assign({}, current, { meta, players })
  return { snapshot, changes }
}

function refreshButtonHtml() { return `<button class="btn sm" id="refresh-b" title="">⟳ Refresh</button>` }

async function initRefresh() {
  const b = document.getElementById('refresh-b')
  const mcp = await refreshMcp()
  const tick = () => {
    const until = refreshLockedUntil()
    const left = until - Date.now()
    if (!mcp) { b.disabled = true; b.title = `Refresh works in the Claude app version; this copy uses the saved TwoGunGPT data from ${S.meta.pulledAt}`; return }
    if (left > 0) { b.disabled = true; b.title = `Refresh again in ${Math.ceil(left / 60000)} min (TwoGunGPT is hit gently, ruling D9)`; return }
    b.disabled = false; b.title = 'Ask TwoGunGPT whether the board changed, then fetch the new numbers (one press, paced calls)'
  }
  tick(); setInterval(tick, 15000)
  b.addEventListener('click', async () => {
    if (b.disabled) return
    const st = refreshState(); st.cooldownUntil = Date.now() + REFRESH_COOLDOWN_MS; st.lastPress = Date.now(); refreshStore(st); tick()
    const txt = document.getElementById('progress').querySelector('.txt')
    try {
      const r = await refreshSnapshot(S.snapshot, msg => { txt.textContent = 'Refresh: ' + msg })
      if (r.unchanged) { txt.textContent = `TwoGunGPT hasn't updated since ${r.boardUpdated}; nothing to fetch`; return }
      txt.textContent = 'Refresh: rebuilding the model…'
      applySnapshot(r.snapshot)
      showToast(r.changes.length ? `Updated: ${r.changes.slice(0, 3).join('; ')}${r.changes.length > 3 ? ` (+${r.changes.length - 3} more)` : ''}` : 'Board updated; no player numbers moved')
    } catch (e) {
      const code = e && e.code
      if (code === 'rate_limited' || /rate.?limit/i.test(String(e && e.message))) { const s2 = refreshState(); s2.rateLimitUntil = Date.now() + REFRESH_RATELIMIT_MS; refreshStore(s2) }
      txt.textContent = 'Refresh failed' + (code ? ` (${code})` : '') + ': ' + (e && e.message || e)
      txt.className = 'txt bad'
      tick()
    }
  })
}

function setProgress(p) {
