  el.querySelector('.bar i').style.width = (p.pct || 0) + '%'
  el.querySelector('.txt').textContent = p.note || p.stage || ''
  el.querySelector('.txt').className = 'txt'
  S.progressNote = p.note || p.stage || ''
  if (!S.ready) { renderGauges(null, localValidate(S.lineup)); renderTakeaways(null, null) }
}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '')
  if (!h) return
  const q = new URLSearchParams(h)
  const cpt = q.get('cpt'), flex = (q.get('flex') || '').split(',').filter(Boolean)
  if (cpt && S.byId.has(cpt)) S.lineup.cpt = cpt
  flex.slice(0, 5).forEach((id, i) => { if (S.byId.has(id) && id !== S.lineup.cpt) S.lineup.flex[i] = id })
  if (q.get('view') === 'cards') S.view = 'cards'
}
function writeHash() {
  const ids = S.lineup.flex.filter(Boolean)
  const parts = []
  if (S.lineup.cpt) parts.push('cpt=' + S.lineup.cpt)
  if (ids.length) parts.push('flex=' + ids.join(','))
  if (/(^|&)engine=main(&|$)/.test(location.hash)) parts.push('engine=main')
  try { history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname + location.search) } catch (e) { /* file:// may refuse; the hash is a convenience */ }
}

function onLineupEdit() {
  const v = localValidate(S.lineup)
  renderLineup(v)
  renderPool()
  writeHash()
  if (!v.ok || !S.ready) { S.analysis = null; renderGauges(null, v); renderLower(null); renderSwaps(null); renderTakeaways(null, v) }
  clearTimeout(S.timer)
  S.timer = setTimeout(runAnalysis, 150)
}

async function runAnalysis() {
  const seq = ++S.runSeq
  const v = localValidate(S.lineup)
  if (!S.ready || !v.ok) return
  const lineup = { cpt: S.lineup.cpt, flex: S.lineup.flex.slice() }
  try {
    const ev = await S.host.validate(lineup)
    if (seq !== S.runSeq) return
    if (!ev.ok) { renderLineup(Object.assign({}, v, ev)); renderGauges(null, ev); renderTakeaways(null, ev); return }
    const a = await S.host.analyze(lineup)
    if (seq !== S.runSeq) return
    if (S.host.hasSwaps && !a.swaps) { a.swaps = await S.host.swaps(lineup); if (seq !== S.runSeq) return }
    S.analysis = a
    S.analysisFor = savedDupKey(lineup.cpt, lineup.flex)   // Save captures gauges only from an analysis of the same lineup
    savedScoreFromBuilder()                                 // and fills a lineup saved a moment before this landed
    renderGauges(a, ev)
    renderTakeaways(a, ev)
    renderLower(a)
    renderSwaps(a)
    renderLineup(v)      // swap chips under the slots come from the analysis
  } catch (e) {
    console.error(e)
    document.getElementById('gauges').innerHTML = gaugesWaiting('Engine error: ' + (e.message || e))
  }
}

function showToast(text, action, fn, kind) {
  let t = document.getElementById('toast')
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t) }
  const warn = kind === 'warn'
  t.innerHTML = `${warn ? '<span class="ic" aria-hidden="true">⚠</span>' : ''}<span>${esc(text)}</span>${action ? `<button class="btn sm primary">${esc(action)}</button>` : ''}`
  t.className = warn ? 'show warn' : 'show'
  if (warn) t.setAttribute('role', 'alert'); else t.removeAttribute('role')
  const b = t.querySelector('button'); if (b) b.onclick = () => { t.className = ''; fn && fn() }
  clearTimeout(t._h); t._h = setTimeout(() => { t.className = '' }, warn ? 8000 : 6000)
}

function initTheme() {
  let th = null
  try { th = localStorage.getItem('lineuplab-tgff.theme') } catch (e) { /* storage may be blocked */ }
  const hostTheme = document.documentElement.getAttribute('data-theme')   // the artifact host may set this itself
  document.documentElement.setAttribute('data-theme', th || hostTheme || 'dark')
  document.getElementById('theme-b').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
    document.documentElement.setAttribute('data-theme', next)
    try { localStorage.setItem('lineuplab-tgff.theme', next) } catch (e) { /* ignore */ }
  })
}

function bindKeys() {
  document.addEventListener('keydown', ev => {
    const inInput = /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)
    if ((ev.key === '/' && !inInput) || (ev.ctrlKey && ev.key.toLowerCase() === 'k')) { ev.preventDefault(); const q = document.getElementById('pool-q'); q.focus(); q.select(); return }
    if (inInput) {
      if (ev.key === 'Enter' && ev.target.id === 'pool-q') {
        const first = document.querySelector(S.view === 'cards' ? '#pool-cards .pc' : '#pool-body tr'); if (!first) return   // first visible match, whatever its state
        ev.preventDefault()
        const lock = poolLockById(first.dataset.id)   // locked (Adam 2026-10-12, D13): do nothing but say why; never fall through to another player
        if (lock) { flashMsg(lock.tip); return }
        if (ev.shiftKey) setCaptain(first.dataset.id); else toggleFlex(first.dataset.id)
      }
      if (ev.key === 'Escape') ev.target.blur()
      return
    }
    if (ev.ctrlKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undoEdit() }
    else if (ev.ctrlKey && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redoEdit() }
    else if ((ev.key === 'Delete' || ev.key === 'Backspace') && S.selected != null) { ev.preventDefault(); removeSlot(S.selected) }
    else if (ev.key === 'Escape' && S.selected != null) { S.selected = null; renderLineup(localValidate(S.lineup)); renderPool() }
  })
}

function readContestFromHost(host) {
  const fr = host.fitReport || {}
  const base = S.contest || contestSpec(CONTESTS[0])
  S.contest = Object.assign({}, base, { size: fr.fieldSize || base.size, subsampled: !!fr.subsampled })
  const c = S.contest
  document.getElementById('contest-sel').title = `Field of ${contestLabel(c)}\n${CONTEST_NOTE}`
}

// Assumptions footer: the engine's own list (it states the ownership fit and who has no ownership posted).
function renderAssumptions(host) {
  const asm = (host.info && Array.isArray(host.info.assumptions) ? host.info.assumptions : []).map(x => typeof x === 'string' ? x : JSON.stringify(x))
  const f = document.getElementById('assume')
  f.innerHTML = `<details><summary>Model assumptions (${asm.length})</summary><ul>${asm.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>`
}

function startEngine(snapshot) {
  const engineSource = document.getElementById('engine-src').textContent
  const workerSource = document.getElementById('worker-src').textContent
  const c = S.contest || contestSpec(CONTESTS[0])
  S.ready = false
  S.host = createEngineHost({
    engineSource, workerSource, snapshot,
    opts: { sims: (S.sims = window.innerWidth < 760 ? 5000 : 10000), seed: 20261012, fieldSize: c.size, forceMain: /(^|&)engine=main(&|$)/.test(location.hash) },
    onProgress: setProgress
  })
  S.host.ready.then(async host => {
    for (const ep of host.players) { const p = S.byId.get(ep.id); if (p) Object.assign(p, ep) }
    S.ready = true
    readContestFromHost(host)
    const el = document.getElementById('progress')
    el.classList.add('done')
    el.querySelector('.bar i').style.width = '100%'
    el.querySelector('.txt').textContent = `Model ready · ${(host.legalCount || 0).toLocaleString('en-US')} legal lineups · ${host.mode === 'worker' ? 'background thread' : 'main thread'}${host.fitReport && host.fitReport.mock ? ' · MOCK ENGINE (fake numbers)' : ''}`
    renderAssumptions(host)
    renderPool()
    onLineupEdit()
    savedScoreRun()      // lineups saved before the model was ready
  }).catch(e => {
    console.error(e)
    const el = document.getElementById('progress')
    el.querySelector('.txt').textContent = 'Engine failed to start: ' + (e.message || e)
    el.querySelector('.txt').className = 'txt bad'
  })
}

// Replace the data (refresh) and rebuild the engine; the lineup is kept where its players still exist.
function applySnapshot(snapshot) {
  S.snapshot = snapshot; S.meta = snapshot.meta
  S.players = snapshot.players.map(p => Object.assign({}, p))
  S.byId = new Map(S.players.map(p => [p.id, p]))
  if (S.lineup.cpt && !S.byId.has(S.lineup.cpt)) S.lineup.cpt = null
  S.lineup.flex = S.lineup.flex.map(id => (id && S.byId.has(id)) ? id : null)
  S.ready = false; S.analysis = null; S.analysisFor = null; S.runSeq++   // an in-flight analysis of the old data must not land
  document.getElementById('pill-txt').textContent = `TwoGunGPT data · board updated ${snapshot.meta.boardUpdated}`
  renderPool(); onLineupEdit()
  startEngine(snapshot)
}

async function changeContest(c) {
  const spec = contestSpec(c)
  S.contest = Object.assign({}, spec)
  if (!S.host || !S.ready) return
  S.ready = false; S.analysis = null; S.analysisFor = null; S.prevHead = {}; S.runSeq++   // nor one sized for the old contest
  setProgress({ pct: 10, note: `Re-sizing the field to ${c.size.toLocaleString('en-US')} entries…` })
  try {
    await S.host.setContest({ size: spec.size })
    S.ready = true
    readContestFromHost(S.host); renderAssumptions(S.host)
    const el = document.getElementById('progress'); el.classList.add('done'); el.querySelector('.bar i').style.width = '100%'
    el.querySelector('.txt').textContent = `Field re-sized: ${contestLabel(S.contest)}`
    onLineupEdit()
    savedScoreRun()
  } catch (e) { console.error(e); setProgress({ pct: 0, note: 'Could not re-size the field: ' + (e.message || e) }) }
}

function bindContest() {
  const sel = document.getElementById('contest-sel'), custom = document.getElementById('contest-custom')
  sel.addEventListener('change', () => {
    const c = CONTESTS.find(x => x.key === sel.value)
    custom.hidden = c.key !== 'custom'
    if (c.key !== 'custom') changeContest(c)
  })
  document.getElementById('c-go').addEventListener('click', () => {
    const size = Math.round(+document.getElementById('c-size').value)
    if (!(size >= 2)) { showToast('Enter a field size'); return }
    changeContest({ key: 'custom', size })
  })
}

function init() {
  S.snapshot = loadSnapshot()
  S.meta = S.snapshot.meta
  S.assets = loadAssets()
  S.players = S.snapshot.players.map(p => Object.assign({}, p))
  S.byId = new Map(S.players.map(p => [p.id, p]))
  S.filters.maxSal = Math.max(...S.players.map(p => p.salary))
  S.contest = contestSpec(CONTESTS[0])
  try { S.view = localStorage.getItem('lineuplab-tgff.view') || 'table' } catch (e) { /* ignore */ }
  const app = document.getElementById('app')
  app.innerHTML = headerHtml(S.meta) + appPageTabsHtml() + `<div id="view-build"><div class="cols">${poolHtml()}<div class="rcol">${lineupHtml()}<div class="card takeaways" id="takeaways"></div><div class="gauges" id="gauges"></div>${needsCardHtml()}</div></div>` + lowerHtml() + `</div><div id="view-saved" class="saved-view" hidden></div><div class="assume" id="assume"></div>`
  initTheme()
  parseHash()
  bindPool(); bindLineup(); bindLower(); bindKeys(); bindTakeaways(); bindContest(); initRefresh(); savedViewBind()
  document.getElementById('vtabs').addEventListener('click', ev => { const b = ev.target.closest('[data-page]'); if (b) appSetPage(b.dataset.page) })
  let page = 'build'
  try { page = localStorage.getItem(APP_PAGE_KEY) || 'build' } catch (e) { /* ignore */ }
  appSetPage(page)
  savedStoreInit(S.meta, S.byId, savedStoreChanged)
  renderPool()
  const v = localValidate(S.lineup)
  renderLineup(v)
  renderGauges(null, v)
  renderTakeaways(null, v)
  renderLower(null)
  renderSwaps(null)
  startEngine(S.snapshot)
}

// The artifact host may inject this page after the document has loaded, so do not rely on DOMContentLoaded alone.
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init()

</script>
</body>
