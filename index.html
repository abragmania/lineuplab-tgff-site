<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LineupLab-TGFF</title>
<meta name="description" content="DraftKings NFL Showdown lineup checker: feasibility and uniqueness from TwoGunGPT data, BUF@LAR week 5">
<style>
/* LineupLab-TGFF page style. House palette from SPEC-v1 "House style". Dark is the default theme. */
:root {
  color-scheme: dark;
  --bg: #0e1116; --surface: #151a22; --surface-2: #1b212b; --border: #232a36;
  --text: #e7e9ee; --muted: #8d95a3; --dim: #626a78;
  --gold: #f0b429; --red: #b23a3a; --green: #2f8f5b; --blue: #3b74c9;
  --red-text: #e06c6c; --green-text: #4fc47f;
  --buf: #00338D; --buf-2: #C60C30; --lar: #003594; --lar-2: #FFA300;
  --qb: #c9a7f5; --rb: #9fdcb0; --wr: #9cc3f2; --te: #f5c08a; --k: #f0a2d8; --dst: #aab4c3;
  --row: 38px; --fs: 14px; --radius: 8px;
  --hist-lineup: #3b74c9; --hist-win: #f0b429;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f4f7; --surface: #ffffff; --surface-2: #eceef3; --border: #d5d9e2;
  --text: #1b1f27; --muted: #5a6273; --dim: #8a92a3;
  --red-text: #a83232; --green-text: #237a4a;
  --qb: #6d3fb5; --rb: #237a4a; --wr: #2c5fb3; --te: #b8651b; --k: #b03a8e; --dst: #5a6273;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-size: var(--fs); line-height: 1.3;
  font-family: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; }
a { color: var(--blue); }
.num { font-variant-numeric: tabular-nums; }
.est { font-style: italic; }
.gold { color: var(--gold); }
.good { color: var(--green-text); }
.bad { color: var(--red-text); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 0 16px 32px; }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; height: 52px; padding: 0 2px; }
.hdr .brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; white-space: nowrap; }
.hdr .brand span { color: var(--gold); }
.hdr .game { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.hdr .at { color: var(--dim); }
.hdr .line { color: var(--muted); white-space: nowrap; }
.hdr .line b { color: var(--text); font-weight: 600; }
.hdr .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
.chip.team { color: #fff; }
.chip.team.BUF { background: var(--buf); box-shadow: inset 0 0 0 1px var(--buf-2); }
.chip.team.LAR { background: var(--lar); box-shadow: inset 0 0 0 1px var(--lar-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 12px; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.btn { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.sm { height: 22px; padding: 0 7px; font-size: 12px; }
.progress { height: 34px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); padding: 0 2px 6px; }
.progress .spacer { flex: 1; }
.progress .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress .bar { flex: 0 0 260px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s; }
.progress.done .bar i { background: var(--green); }

/* ---------- layout ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 540px; gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.card h2 { margin: 0; padding: 0 12px; height: 34px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
.card h2 .right { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--dim); }

/* ---------- pool ---------- */
.pool .tools { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pool .tools input { height: 26px; width: 170px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.fchip { height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
.fchip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.pool .scroll { max-height: 812px; overflow: auto; }
table.pool-t { border-collapse: collapse; width: 100%; table-layout: fixed; }
.pool-t th, .pool-t td { height: var(--row); padding: 0 5px; white-space: nowrap; overflow: hidden; border-bottom: 1px solid var(--border); text-align: right; }
.pool-t td:first-child { overflow: visible; }
.pool-t th { overflow: hidden; text-overflow: ellipsis; }
.pool-t th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
.pool-t th.on { color: var(--text); }
.pool-t th .arr { color: var(--blue); font-size: 10px; margin-left: 2px; }
.pool-t th:first-child, .pool-t td:first-child { text-align: left; padding-left: 10px; }
.pool-t td.pos, .pool-t th.pos, .pool-t td.act, .pool-t th.act { text-align: center; }
.pool-t td.act { padding: 0 4px; }
.acts { display: inline-flex; gap: 4px; vertical-align: middle; }
.pool-t tbody tr { cursor: pointer; user-select: none; }
.pool-t td.rel { position: relative; }
.hint { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--dim); background: var(--surface-2); padding: 2px 8px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .15s; white-space: nowrap; }
.pool-t tr:hover .hint, .pc:hover .hint { opacity: 1; }
.pc .hint { position: static; transform: none; display: block; text-align: center; margin-top: 6px; height: 16px; }
.tip { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 12px; color: var(--muted); background: rgba(59,116,201,.12); border-bottom: 1px solid var(--border); }
.tip[hidden] { display: none; }
.tip span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pool-t tr:hover td { background: var(--surface-2); }
.pool-t tr.in td { background: rgba(59,116,201,.10); }
.pool-t tr.zero td { color: var(--dim); }
.pool-t .nm { font-weight: 600; }
.pool-t .mu { color: var(--muted); font-size: 12px; margin-left: 5px; }
.pool-t .inj { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-left: 5px; vertical-align: 1px; cursor: help; }
.pos-c { display: inline-block; min-width: 30px; padding: 0 4px; height: 18px; line-height: 18px; border-radius: 4px; font-size: 11px; font-weight: 700; text-align: center; color: var(--bg); }
.pos-c.QB { background: var(--qb); } .pos-c.RB { background: var(--rb); } .pos-c.WR { background: var(--wr); }
.pos-c.TE { background: var(--te); } .pos-c.K { background: var(--k); } .pos-c.DST { background: var(--dst); }
[data-theme="light"] .pos-c { color: #fff; }
.abtn { width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); font-size: 15px; font-weight: 700; padding: 0; margin: 0; line-height: 26px; font-size: 13px; }
.abtn.c { color: var(--gold); }
.abtn.f { color: var(--blue); }
.abtn:hover { border-color: var(--muted); }
.abtn.on.c { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.abtn.on.f { background: var(--blue); color: #fff; border-color: var(--blue); }
.abtn:disabled { opacity: .35; cursor: default; }

/* ---------- lineup card ---------- */
.lineup .slots { padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 4px; }
.slot { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px 64px 22px; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); }
.slot.cpt { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(240,180,41,.35); }
.slot .lab { font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--muted); }
.slot.cpt .lab { color: var(--gold); }
.slot .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .who .mu { color: var(--muted); font-size: 12px; margin-left: 5px; }
.slot .who .own { color: var(--muted); font-size: 12px; margin-left: 5px; }
.slot .who.empty { color: var(--dim); font-style: italic; }
.slot .sal { text-align: right; color: var(--text); }
.slot.cpt .sal { color: var(--gold); }
.slot .x { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--muted); padding: 0; line-height: 20px; }
.slot .x:hover { color: var(--red-text); border-color: var(--red-text); }
.slot .x:disabled { visibility: hidden; }
.salary { padding: 6px 10px 4px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.salary .bar { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.salary .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .15s; }
.salary.over .bar i { background: var(--red); }
.salary .left { color: var(--muted); }
.salary.over .left { color: var(--red-text); font-weight: 600; }
.lineup .foot { display: flex; align-items: center; gap: 8px; padding: 4px 10px 10px; flex-wrap: wrap; }
.lineup .foot .msg { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lineup .foot .msg.bad { color: var(--red-text); }
.lineup .foot .msg.ok { color: var(--green-text); }

/* ---------- gauges ---------- */
.gauges { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
.gauge { padding: 0 0 8px; }
.gauge .head { display: flex; flex-direction: column; gap: 3px; padding: 8px 12px 4px; height: 58px; }
.gauge .head .l1 { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.gauge .head .unit { font-size: 12px; color: var(--muted); }
.gauge .big { font-size: 26px; font-weight: 700; line-height: 1; white-space: nowrap; }
.gauge .head .l1 .big:has(+ .unit) { max-width: 100%; }
.gauge .head .unit { flex: none; }
.gauge .head .l1 { min-width: 0; }
.gauge .head .l1 .big { overflow: hidden; text-overflow: ellipsis; }
.gauge .verdict { font-size: 12px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.gauge .verdict.DEAD { color: var(--red-text); }
.gauge .verdict.LONG { color: var(--gold); }
.gauge .verdict.REAL { color: var(--green-text); }
.gauge .rows { padding: 0 12px; }
.gauge .r { display: flex; justify-content: space-between; align-items: baseline; height: 22px; font-size: 13px; border-bottom: 1px dashed var(--border); }
.gauge .r:last-child { border-bottom: 0; }
.gauge .r .k { color: var(--muted); white-space: nowrap; }
.gauge .r .v { white-space: nowrap; font-weight: 600; }
.gauge .r .v small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.gauge .chart { padding: 6px 12px 0; }
.gauge .chart svg { display: block; width: 100%; height: 58px; }
.gauge .note { padding: 6px 12px 0; font-size: 12px; color: var(--muted); line-height: 1.35; min-height: 32px; }
.gauge .note.warn { color: var(--gold); }
.gauge .wait { padding: 20px 12px; color: var(--dim); font-style: italic; text-align: center; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); padding: 0 12px; }
.legend i { display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

/* ---------- lower row: scripts + what has to happen ---------- */
.lower { display: grid; grid-template-columns: 480px minmax(0,1fr); gap: 16px; margin-top: 16px; }
.needs { margin-top: 10px; }
table.t { border-collapse: collapse; width: 100%; }
.t th, .t td { height: 30px; padding: 0 10px; white-space: nowrap; border-bottom: 1px solid var(--border); text-align: right; }
.t th { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--surface-2); }
.t th:first-child, .t td:first-child { text-align: left; }
.t tr:last-child td { border-bottom: 0; }
.t td .mu { color: var(--muted); font-size: 12px; margin-left: 5px; }
.t .empty td { color: var(--dim); font-style: italic; text-align: left; }
.sharebar { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.sharebar i { display: block; height: 100%; background: var(--blue); }

/* ---------- swaps ---------- */
.swaps .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; }
.swaps .col { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-width: 0; }
.swaps .col:nth-child(3n) { border-right: 0; }
.swaps .col:nth-last-child(-n+3) { border-bottom: 0; }
.swaps .col h3 { margin: 0; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swaps .col h3.cpt { color: var(--gold); }
.swaps .col h3 .cur { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.opt { display: grid; grid-template-columns: minmax(0,1fr) 54px 44px 50px; gap: 4px; align-items: center; height: 28px; padding: 0 10px; border: 0; border-bottom: 1px solid var(--border); background: transparent; width: 100%; text-align: left; font-size: 13px; }
.opt:hover { background: var(--surface-2); }
.opt .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .n .mu { color: var(--muted); font-size: 11px; margin-left: 4px; }
.opt .d { text-align: right; white-space: nowrap; font-size: 12px; }
.opt .d.ev { font-weight: 700; }
.swaps .none { padding: 10px; color: var(--dim); font-style: italic; font-size: 12px; }
.swaps .legend { padding: 6px 12px; }

/* ---------- gauge visuals ---------- */
.gauge { position: relative; overflow: hidden; }
.gauge::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; }
.gauge.acc-feas::before { background: linear-gradient(90deg, var(--red), var(--gold), var(--green)); }
.gauge.acc-uniq::before { background: linear-gradient(90deg, #5ea9f0, #a78bfa); }
.gauge.acc-ev::before { background: linear-gradient(90deg, var(--green), #7ee3a5); }
.gauge .big.blue { color: #5ea9f0; }
.gauge .dialwrap { padding: 0 12px; }
.gauge .dialwrap svg { display: block; width: 150px; height: 68px; margin: 0 auto; }
.gauge .chart svg.meter { height: 46px; }
.gauge .chart svg.roi { height: 34px; }
.gauge .chart svg.hist { height: 40px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; padding: 10px; }
.tile { --heat: 0; position: relative; height: 72px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(240,180,41, calc(var(--heat) * .55)), rgba(59,116,201, calc(var(--heat) * .35))), var(--surface-2); overflow: hidden; }
.tile .tn { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .ts { display: flex; align-items: baseline; gap: 5px; margin-top: 4px; }
.tile .share { font-size: 20px; font-weight: 700; line-height: 1; }
.tile .of { font-size: 11px; color: var(--muted); }
.tile .to { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; white-space: nowrap; }
.tile.off { opacity: .7; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 8px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.35); transition: all .15s; z-index: 10; }
#toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
#toast.show.warn { border-color: var(--gold); border-left: 5px solid var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface-2)); font-weight: 600; }
#toast .ic { color: var(--gold); font-size: 16px; line-height: 1; }
.slot { transition: border-color .15s, box-shadow .15s, background .15s; }
.slot.filled { border-left-width: 4px; }
.slot.filled.BUF { border-left-color: var(--buf-2); }
.slot.filled.LAR { border-left-color: var(--lar-2); }
.slot.filled.cpt { border-color: var(--gold); border-left-color: var(--gold); box-shadow: 0 0 0 1px rgba(240,180,41,.35), 0 0 14px rgba(240,180,41,.22); }
.slot.sel { outline: 2px solid var(--blue); outline-offset: 0; }
.slot.over { background: rgba(59,116,201,.18); border-color: var(--blue); }
@keyframes pop { 0% { transform: scale(.85); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }
.slot .x { opacity: 0; transition: opacity .15s; }
.slot:hover .x, .slot.sel .x { opacity: 1; }
.hdr .line.bad, .progress .txt.bad { color: var(--red-text); }

/* ---------- theme toggle ---------- */
.theme { width: 28px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); font-size: 14px; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .cols { grid-template-columns: minmax(0,1fr); }
  .lower { grid-template-columns: minmax(0,1fr); }
  .pool .scroll { max-height: 520px; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px 24px; }
  .hdr { height: auto; padding: 8px 0; gap: 8px; }
  .gauges { grid-template-columns: minmax(0,1fr); }
  .lower { grid-template-columns: minmax(0,1fr); }
  .swaps .grid { grid-template-columns: minmax(0,1fr); }
  .swaps .col { border-right: 0; border-bottom: 1px solid var(--border); }
  .pool-t .hide-sm, .pool-t .hide-xs { display: none; }
  .pool-t { font-size: 13px; }
  .pool-t th, .pool-t td { padding: 0 4px; }
  .pool-t .pcell .av { display: none; }
  .hint { display: none; }
  .hdr .pill, .hdr .at { display: none; }
  .hdr .game { order: 2; }
  .hdr .brand { font-size: 16px; }
  .hdr .line { font-size: 12px; }
  .progress .txt { flex: 1 1 100%; }
  .progress .contest { flex-wrap: wrap; }
  .pool .tools { gap: 4px; }
  .sal-f input[type=range] { width: 50px; }
  .slot .who .sub .pts { display: none; }
  .slot .who .nm { font-size: 14px; }
  .slot.cpt .who .nm { font-size: 15px; }
  .gauge .note, .work { font-size: 11px; }
  .takeaways li { font-size: 12px; }
  .pool .tools input { width: 100%; }
  .slot { grid-template-columns: 38px minmax(0,1fr) 60px 22px; }
  .slot .sal { grid-column: 3; }
  .slot .pos-c { display: none; }
  .progress .bar { flex: 1 1 auto; }
}


/* ---------- second pass: avatars, hero slots, cards, takeaways, contest picker ---------- */
.av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid var(--border); overflow: hidden; flex: none; background: var(--surface-2); vertical-align: middle; }
.av img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.av.logo img { object-fit: contain; padding: 3px; }
.av.init { color: #fff; font-weight: 700; letter-spacing: .3px; }
.av.ph { width: 44px; height: 44px; border-style: dashed; }
.tlogo { vertical-align: -3px; margin-right: 4px; }
.pcell { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
.ptxt { display: inline-flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.ptxt .nm { font-weight: 600; white-space: nowrap; }
.ptxt .mu { margin-left: 0; font-size: 11px; }
.badge { font-size: 9px; font-weight: 700; letter-spacing: .4px; padding: 0 4px; border-radius: 3px; background: var(--blue); color: #fff; margin-left: 5px; vertical-align: 1px; }
.badge.cpt { background: var(--gold); color: #1a1400; }
.pool-t tr.in td { opacity: .78; }
.pool-t tr.in .badge { opacity: 1; }
.pool-t tr.over td { color: var(--dim); }

/* ---------- split-the-difference layout (Adam 2026-10-12, D11 amendment) ---------- */
/* Lineup column ~620px at 1280, growing toward 740 on wide screens; the pool takes the rest. */
.cols { grid-template-columns: minmax(0, 1fr) clamp(620px, 48vw, 740px); }
@media (max-width: 1240px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.rcol { container-type: inline-size; min-width: 0; }
/* Range bar (72px column) needs pool >= ~620px: pool = viewport - 32 - 16 - lineup; lineup is 691px at 1440, leaving Player ~195px (174px at 1400 cut a long name), so Range shows from 1440 up
   (and in the single-column layout at <=1240). In between it drops; every number column stays. */
@media (min-width: 1241px) and (max-width: 1439px) {
  .pool-t .rng, .pool-t col.rng { display: none; }
}
/* gauges: the big number never collapses; unit/verdict clip with an ellipsis instead of running together */
.gauge .head .l1 .big { flex: none; overflow: visible; max-width: none; }
.gauge .head .l1 .unit { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.gauge .verdict { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gauge .r { gap: 8px; }
.gauge .r .k { flex: none; }
.gauge .r .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* below ~700px of lineup column three gauges do not fit cleanly: 2 + 1 */
@container (min-width: 520px) and (max-width: 779px) {
  .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gauges > .gauge:nth-child(3) { grid-column: 1 / -1; }
}
/* swap chips: whole chips only; ones that do not fit the row wrap out of sight (height-clipped) */
.chips { display: flex; flex: 1 1 0; min-width: 0; max-width: none; height: 20px; flex-wrap: wrap; justify-content: flex-end; overflow: hidden; gap: 0 4px; }
.swc { flex: none; }
/* team tag: readable team colour in both themes */
:root { --buf-t: #e05a6e; --lar-t: #ffb21a; }
:root[data-theme="light"] { --buf-t: #b30a2a; --lar-t: #a35f00; }
.tteam.BUF { color: var(--buf-t); } .tteam.LAR { color: var(--lar-t); }
/* CAPTAIN mode: Own header gold like the $ header */
.pool.cptmode .pool-t th[data-key="own"] { color: var(--gold); }
.pool-t td.up + td.up { padding-left: 6px; }

/* D14 (Adam 2026-10-12): unplayable = faded hard (name still readable), sunk by the sort; graded fades keep their place and stay clickable. */
.pool-t tr.unplayable td { opacity: .3; color: var(--dim); }
.pool-t tr.unplayable .nm { opacity: 1; color: var(--muted); }
.pool-t tr.unplayable .av, .pc.unplayable .av { filter: grayscale(1) opacity(.5); }
.pc.unplayable { opacity: .32; }
/* D13 lock/over dimming wins over D14 fades; light is clearly visible, strong stronger, unplayable stronger still */
.pool-t tr.fade-light:not(.locked):not(.over) td { opacity: .55; }
.pool-t tr.fade-strong:not(.locked):not(.over) td { opacity: .42; }
.pool-t tr.fade-light:not(.locked):not(.over) .av, .pool-t tr.fade-strong:not(.locked):not(.over) .av, .pc.fade-light:not(.locked):not(.over) .av, .pc.fade-strong:not(.locked):not(.over) .av { filter: grayscale(1) opacity(.7); }
.pc.fade-light:not(.locked):not(.over) { opacity: .58; }
.pc.fade-strong:not(.locked):not(.over) { opacity: .45; }
/* Med column (Adam 2026-10-12, D11 no cut names): needs pool >= ~606px so Player keeps >= ~180px; below 1340px wide it hides and the median stays in each Proj hover. */
@media (min-width: 761px) and (max-width: 1339px) {
  .pool-t .med, .pool-t col.med { display: none; }
}
.pool-t th:not(:first-child) { padding: 0 3px; }

/* ---------- Build | Saved lineups switch and the Saved view (D17) ---------- */
#toast { width: max-content; max-width: calc(100vw - 32px); }
.salary .perspot { color: var(--dim); font-size: 12px; font-weight: 500; }
.vtabs { display: flex; gap: 8px; margin: 2px 0 12px; border-bottom: 1px solid var(--border); }

// main thread when a Worker cannot be created (file:// in some browsers, artifact sandboxes).
// The page talks only to the host: host.ready (Promise), host.validate(lineup), host.analyze(lineup).
// Both return Promises so the page code is the same either way.

function createEngineHost({ engineSource, workerSource, snapshot, opts, onProgress, onMode }) {
  const host = { players: null, fitReport: null, legalCount: 0, hasSwaps: false, mode: 'none' }
  let resolveReady, rejectReady
  host.ready = new Promise((res, rej) => { resolveReady = res; rejectReady = rej })

  function startWorker() {
    const blob = new Blob([engineSource, '\n', workerSource], { type: 'text/javascript' })
    const url = URL.createObjectURL(blob)
    const w = new Worker(url)
    const pending = new Map()
    let seq = 0
    w.onmessage = (ev) => {
      const m = ev.data
      if (m.type === 'progress') onProgress(m.progress)
      else if (m.type === 'ready') {
        host.players = m.players; host.fitReport = m.fitReport; host.legalCount = m.legalCount; host.hasSwaps = m.hasSwaps; host.info = m.info
        resolveReady(host)
      } else if (m.type === 'result') { const p = pending.get(m.id); pending.delete(m.id); p && p.res(m.value) }
      else if (m.type === 'error') {
        if (m.id != null) { const p = pending.get(m.id); pending.delete(m.id); p && p.rej(new Error(m.message)) }
        else rejectReady(new Error(m.message))
      }
    }
    w.onerror = (e) => { rejectReady(new Error('worker failed: ' + (e.message || e))) }
    const call = (fn, lineup) => new Promise((res, rej) => { const id = ++seq; pending.set(id, { res, rej }); w.postMessage({ type: 'call', id, fn, lineup }) })
    host.validate = (l) => call('validate', l)
    host.analyze = (l) => call('analyze', l)
    host.swaps = (l) => call('swaps', l)
    host.setContest = async (spec) => { const r = await call('setContest', spec); if (r && r.fitReport) { host.fitReport = r.fitReport; host.players = r.players } return r }
    host.mode = 'worker'
    w.postMessage({ type: 'init', snapshot, opts })
  }

  async function startMainThread() {
    host.mode = 'main'
    // eslint-disable-next-line no-new-func
    const mod = new Function(engineSource + '\nreturn { createEngine };')()
    const engine = await mod.createEngine(snapshot, Object.assign({}, opts, { onProgress }))
    host.players = engine.players; host.fitReport = engine.fitReport; host.legalCount = engine.legalCount; host.info = engine.info || null
    host.hasSwaps = typeof engine.swaps === 'function'
    host.validate = async (l) => engine.validate(l)
    host.analyze = async (l) => engine.analyze(l)
    host.swaps = async (l) => engine.swaps(l)
    host.setContest = async (spec) => { if (typeof engine.setContest !== 'function') throw new Error('engine has no setContest'); await engine.setContest(Object.assign({}, spec, { onProgress })); host.fitReport = engine.fitReport; host.players = engine.players; return { fitReport: engine.fitReport } }
    resolveReady(host)
  }

  let usedWorker = false
  try {
    if (typeof Worker === 'function' && !(opts && opts.forceMain)) { startWorker(); usedWorker = true }
  } catch (e) { usedWorker = false }
  if (!usedWorker) startMainThread().catch(rejectReady)
  else {
    // If the worker dies before it is ready (e.g. blob workers blocked), fall back to the main thread once.
    const origReady = host.ready
    host.ready = origReady.catch(async (err) => {
      console.warn('Worker engine failed, falling back to the main thread:', err)
      host.ready = new Promise((res, rej) => { resolveReady = res; rejectReady = rej })
      await startMainThread()
      return host
    })
  }
  Promise.resolve().then(() => onMode && onMode(host.mode))
  return host
}


// ---- src/ui/avatar.js ----
// Avatars and reference assets (headshots, logos, jersey, bio) from the inlined assets JSON
// (data/reference/<snapshot>-assets.json, free public sources; projections and ownership stay TwoGunGPT-only).
// avatarFor(player, size) is the single swap point: headshot -> team logo (DST) -> initials in team colour.

function loadAssets() {
  const el = document.getElementById('assets')
  if (!el) return { teams: {}, players: {} }
  try { const a = JSON.parse(el.textContent); return { teams: a.teams || {}, players: a.players || {} } } catch (e) { return { teams: {}, players: {} } }
}

function teamColor(team, which) {
  const t = S.assets.teams[team]
  if (t && t.colors && t.colors[which]) return t.colors[which]
  return team === 'BUF' ? (which === 'secondary' ? '#C60C30' : '#00338D') : (which === 'secondary' ? '#FFA300' : '#003594')
}

function playerRef(p) { return S.assets.players[p.id] || null }

function avatarFor(p, size) {
  size = size || 32
  const ref = playerRef(p)
  const ring = teamColor(p.team, 'secondary')
  const style = `width:${size}px;height:${size}px;border-color:${ring}`
  if (ref && ref.headshot) return `<span class="av" style="${style}"><img src="${ref.headshot}" alt="" loading="lazy" draggable="false"></span>`
  const logo = S.assets.teams[p.team] && S.assets.teams[p.team].logo
  if (p.pos === 'DST' && logo) return `<span class="av logo" style="${style}"><img src="${logo}" alt="" draggable="false"></span>`
  const initials = p.pos === 'DST' ? p.team : p.name.split(/\s+/).filter(w => !/^(jr|sr|ii|iii|iv)\.?$/i.test(w)).map(w => w[0]).join('').slice(0, 2).toUpperCase()
  return `<span class="av init" style="${style};background:${teamColor(p.team, 'primary')};font-size:${Math.round(size * 0.38)}px">${esc(initials)}</span>`
}

function teamLogo(team, size) {
  const logo = S.assets.teams[team] && S.assets.teams[team].logo
  return logo ? `<img class="tlogo" src="${logo}" alt="" style="width:${size}px;height:${size}px" draggable="false">` : ''
}

// Small team tag (logo + abbreviation in the team colour) used instead of the vs/@ matchup text (one game only).
function teamTag(p) { return `<span class="tteam ${p.team}">${teamLogo(p.team, 12)}${p.team}</span>` }

// Hover text for a player: injury, jersey, short bio.
function playerTitle(p) {
  const ref = playerRef(p)
  const parts = [`${p.name} (${p.team} ${p.pos})`]
  if (ref) {
    const bio = []
    if (ref.jersey) bio.push('#' + ref.jersey)
    if (ref.age) bio.push(ref.age + ' yrs')
    if (ref.college) bio.push(ref.college)
    if (ref.experience != null) bio.push(ref.experience === 0 ? 'rookie' : ref.experience + ' yrs exp')
    if (bio.length) parts.push(bio.join(' · '))
  }
  if (p.injury) {
    const note = p.injury.note || ''
    const trunc = note.length >= 180 && !/[.!?]$/.test(note.trim()) ? '…' : ''
    parts.push(`${p.injury.status} (${p.injury.call}): ${note}${trunc}`)
  }
  if (p.projection <= 0) parts.push('Projection 0: the field never rosters him')
  return parts.join('\n')
}


// ---- src/ui/pool.js ----
// Player pool: FLEX | CAPTAIN mode toggle, sortable table (avatars, range bars, graded upside columns) or a
// card grid; team, position, salary and "fits my salary left" filters; search. No add buttons: a click adds
// (FLEX mode: to FLEX, CAPTAIN mode or shift-click or double-click: as Captain); clicking a rostered player removes him.

// Upside columns are graded by percentile across the whole pool (five tints); median and projection stay plain.
const POOL_COLS = [
  { key: 'name', label: 'Player', title: 'Player and matchup. A gold dot marks an injury note (hover the row).' },
  { key: 'salary', label: '$', title: 'Salary at the current mode (Captain = 1.5x the FLEX salary).' },
  { key: 'range', label: 'Range', cls: 'hide-sm rng', title: 'Range bar: floor (10th percentile) → median tick → ceiling → nuke. The median-to-nuke stretch is the upside tail. Sorts by ceiling.' },
  { key: 'projection', label: 'Proj', cls: 'hide-xs', title: TIP.proj },
  { key: 'median', label: 'Med', cls: 'hide-xs med', title: TIP.med },
  { key: 'ceiling', label: 'Ceil', cls: 'up', grade: true, title: TIP.ceil },
  { key: 'nuke', label: 'Nuke', cls: 'up hide-xs', grade: true, title: TIP.nuke },
  { key: 'upside', label: 'Up×', cls: 'up hide-xs', grade: true, title: 'Upside = (nuke − median) ÷ median: how much bigger his big game is than his typical game. Graded by percentile across this pool.' },
  { key: 'p4x', label: '4x%', cls: 'up hide-xs', grade: true, title: 'His odds of scoring 4x his salary (TwoGunGPT). Graded by percentile across this pool.' },
  { key: 'ceilPerK', label: 'C/$K', cls: 'up hide-xs', grade: true, title: 'Ceiling per $1,000 of salary at the current mode. Graded by percentile across this pool.' },
  { key: 'shootout', label: 'Shoot', cls: 'up hide-xs', grade: true, title: 'Shootout: his average score in the "close, over the total" scripts against his overall median, as +N%. Positive = he scores more when the game turns into a shootout. From the engine\'s simulations; graded by percentile across this pool (D12).' },
  { key: 'own', label: 'Own', title: 'Share of the field rostering him at this mode (FLEX or Captain), as posted by TwoGunGPT. — = nothing posted (the field never plays him there).' }
]
// Fixed widths (px) per column; Player (null) takes the rest and stays >=150px: 402px of numbers + 72px Range (Range hides at laptop width, see style.css).
const POOL_WIDTHS = [null, 54, 64, 44, 42, 40, 40, 40, 36, 40, 48, 42]
const POOL_MAX_PTS = 45
const GRADE_MIN_PROJ = 3.0

function poolMult() { return S.mode === 'cpt' ? 1.5 : 1 }
function poolVal(p, key) {
  const m = poolMult()
  switch (key) {
    case 'salary': return S.mode === 'cpt' ? p.cptSalary : p.salary
    case 'projection': return p.projection * m
    case 'median': return p.median * m
    case 'ceiling': case 'range': return p.ceiling * m
    case 'nuke': return p.nuke * m
    case 'upside': return p.projection < GRADE_MIN_PROJ ? -Infinity : p.median > 0 ? (p.nuke - p.median) / p.median : 0
    case 'p4x': return p.p4x || 0
    case 'ceilPerK': return p.ceiling / (p.salary / 1000)
    case 'shootout': return p.shootoutLift != null ? p.shootoutLift : -Infinity
    case 'own': { const k = S.mode === 'cpt' ? 'cpt' : 'flex'; return p.own && p.own[k] != null ? p.own[k] : -1 }   // posted figure; nothing posted sorts last
    case 'pos': return ['QB', 'RB', 'WR', 'TE', 'K', 'DST'].indexOf(p.pos)
    case 'name': return p.name.toLowerCase()
    default: return p[key]
  }
}

// Percentile rank (0..1) of each graded column across the pool's projected players; recomputed per render.
function poolGrades() {
  const graded = S.players.filter(p => p.projection >= GRADE_MIN_PROJ)
  const g = {}
  for (const c of POOL_COLS) {
    if (!c.grade) continue
    const have = graded.filter(p => isFinite(poolVal(p, c.key)))
    const vals = have.map(p => poolVal(p, c.key)).sort((a, b) => a - b)
    g[c.key] = new Map(have.map(p => { const v = poolVal(p, c.key); return [p.id, vals.filter(x => x < v).length / Math.max(1, vals.length - 1)] }))
  }
  return g
}
function gradeClass(g, key, p) {
  if (p.projection < GRADE_MIN_PROJ || !g[key] || !g[key].has(p.id)) return ''
  const r = g[key].get(p.id)
  return 'g' + (r >= 0.8 ? 5 : r >= 0.6 ? 4 : r >= 0.4 ? 3 : r >= 0.2 ? 2 : 1)
}

// Floor-median-ceiling-nuke bar; the median-to-nuke stretch is drawn in the upside colour.
function rangeBar(p) {
  if (!p.projection) return '<span class="rb empty"></span>'
  const m = poolMult()
  const x = v => Math.max(0, Math.min(100, v * m / (POOL_MAX_PTS * m) * 100))
  const floor = p.pctl && p.pctl['10'] != null ? p.pctl['10'] : 0
  const c = `var(--${p.pos.toLowerCase()})`
  return `<span class="rb" title="Floor (10th pct) ${(floor * m).toFixed(1)} · median ${(p.median * m).toFixed(1)} · ceiling ${(p.ceiling * m).toFixed(1)} · nuke ${(p.nuke * m).toFixed(1)}${m > 1 ? ' (Captain 1.5x)' : ''}">
<i class="base" style="left:${x(floor)}%;width:${x(p.median) - x(floor)}%;background:${c};opacity:.5"></i>
<i class="base up" style="left:${x(p.median)}%;width:${x(p.ceiling) - x(p.median)}%"></i>
<i class="base up2" style="left:${x(p.ceiling)}%;width:${x(p.nuke) - x(p.ceiling)}%"></i>
<i class="tick" style="left:${x(p.median)}%"></i></span>`
}

// Salary room for adding him at the current mode (replacing the selected slot if one is selected); negative = does not fit.
function poolFits(p, v) {
  const slot = S.selected
  if (slot === 'cpt' || (slot == null && S.mode === 'cpt')) { const c = S.lineup.cpt && S.byId.get(S.lineup.cpt); return v.salaryLeft + (c ? c.cptSalary : 0) - p.cptSalary }
  let left = v.salaryLeft
  if (slot != null) { const c = S.lineup.flex[slot] && S.byId.get(S.lineup.flex[slot]); left += c ? c.salary : 0 }
  return left - p.salary
}

// Live, temporary gray-outs (Adam 2026-10-12, D13): one pure helper shared by row, card, click, drag and search so they cannot disagree.
// Returns null (usable) or { reason, tip }. Recomputed on every renderPool, so it lifts the instant the lineup, mode or selection changes.
//  1. 'captain': he is the Captain and the pool action would put him in FLEX (FLEX mode, or a FLEX slot selected).
//  2. 'last': exactly one spot is open (no slot selected) and filling it with him would break the cap, judged by what the click really does (poolLastSpotOver).
// Dollars over the cap if he fills the one open spot (no slot selected, 5 of 6 filled, he is not in the lineup); null when that state does not apply.
// Mirrors the click: Captain open -> he becomes Captain (cptSalary); FLEX open + FLEX mode -> FLEX salary; FLEX open + CAPTAIN mode -> he becomes Captain
// and the old Captain drops into the open FLEX slot (setCaptain), so total = current - old.cptSalary + old.salary + his cptSalary (Adam 2026-10-12, D13).
function poolLastSpotOver(p, v) {
  if (S.selected != null || lineupIds().length !== 5 || lineupHas(p.id)) return null
  if (!S.lineup.cpt) return p.cptSalary - v.salaryLeft
  if (S.mode !== 'cpt') return p.salary - v.salaryLeft
  const old = S.byId.get(S.lineup.cpt)
  return v.salary - old.cptSalary + old.salary + p.cptSalary - CAP
}
function poolLock(p, v) {
  if (S.lineup.cpt === p.id && S.selected !== 'cpt' && (S.selected != null || S.mode !== 'cpt')) {
    return { reason: 'captain', tip: 'Captain — remove him from the lineup card to use him in FLEX' }
  }
  const over = poolLastSpotOver(p, v)
  if (over != null && over > 0) return { reason: 'last', tip: `Doesn't fit the last spot: ${money(over)} over` }
  return null
}
function poolLockById(id) { const p = S.byId.get(id); return p ? poolLock(p, localValidate(S.lineup)) : null }

// ---- D14 (Adam 2026-10-12): unplayable sinks and fades hard; low-$ low-projection low-value players fade lightly/strongly ----
// Pool average points per $1K = MEAN of each player's projection*1000/salary, over players who are not K, not DST and have projection > 0.
function poolAvgPerK() {
  const xs = S.players.filter(p => p.pos !== 'K' && p.pos !== 'DST' && p.projection > 0 && p.salary > 0).map(p => p.projection * 1000 / p.salary)
  return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null
}
// Pure: null | 'light' | 'strong'. Only $1,000-$3,999 salary, projection 3-6, best-lineup rate under 10%, and projection per $1K below the
// pool average by 15-30% (light) or over 30% (strong). K/DST never. Needs the engine's bestRate; with none, nothing is faded.
function fadeLevel(p, poolAvgPerK) {
  if (!p.bestRate || !poolAvgPerK || p.pos === 'K' || p.pos === 'DST') return null
  if (p.salary < 1000 || p.salary > 3999 || p.projection < 3 || p.projection > 6 || p.bestRate.total >= 10) return null
  const below = 1 - (p.projection * 1000 / p.salary) / poolAvgPerK
  return below > 0.30 ? 'strong' : below >= 0.15 ? 'light' : null
}
// D14: K and DST are always viable. The engine's viability wins when present; the projection-0 fallback applies only before the engine has run.
function isKorDST(p) { return ["K", "DST", "D/ST", "DEF"].includes(String(p.pos).toUpperCase()) }
function isUnplayable(p) { return p.viability === 'unplayable' || (p.viability == null && !(p.projection > 0) && !isKorDST(p)) }
function sinks(p) { return isUnplayable(p) ? 1 : 0 }
// Row/card class and hover text for the D14 states, plus the best-lineup rate (shown for everyone once the engine has it).
function poolFlag(p, avg) {
  const br = p.bestRate
  const rate = br ? `In the best lineup ${fmtOwn(br.total)}% of sims (CPT ${fmtOwn(br.cpt)}% · FLEX ${fmtOwn(br.flex)}%)` : ''
  let cls = '', why = ''
  if (isUnplayable(p)) { cls = 'unplayable'; why = !(p.projection > 0) ? 'Not viable: projection 0 or missing' : 'Not viable: projection under 3 at $1,000+' }
  else {
    const lvl = fadeLevel(p, avg)
    if (lvl) { cls = 'fade-' + lvl; why = `Low value for a low-$ play: ${Math.round((1 - (p.projection * 1000 / p.salary) / avg) * 100)}% below the pool's points per $1K, best lineup ${fmtOwn(br.total)}%` }
  }
  return { cls, tip: [rate, why].filter(Boolean).map(t => '\n' + t).join('') }
}

function poolFlags(p, v) {
  const slot = lineupSlotOf(p.id)
  const fit = poolFits(p, v)
  const over = slot == null && fit < 0 && (lineupIds().length < 6 || S.selected != null)
  return { slot, isCpt: slot === 'cpt', inFlex: slot != null && slot !== 'cpt', fit, over, lock: poolLock(p, v) }
}
function hintText(slot, lock) {
  if (lock) return lock.reason === 'captain' ? 'captain' : 'doesn\'t fit'
  if (slot != null) return 'click: remove'
  if (S.selected === 'cpt' || S.mode === 'cpt') return 'click: captain'
  if (S.selected != null) return 'click: fill slot'
  return 'click: flex · shift: captain'
}
function ownCellMode(p) { return ownCell(p, S.mode === 'cpt' ? 'cpt' : 'flex') }

function poolRowHtml(p, v, g, avg) {
  const { slot, isCpt, inFlex, fit, over: over0, lock } = poolFlags(p, v)
  const fl = poolFlag(p, avg)
  const over = over0 && !lock
  const cl = [slot != null ? 'in' : '', p.projection <= 0 ? 'zero' : '', fl.cls, over ? 'over' : '', lock ? 'locked' : ''].join(' ').trim()
  const badge = isCpt ? '<span class="badge cpt">CPT</span>' : inFlex ? '<span class="badge">FLEX</span>' : ''
  const overTip = lock ? `\n${lock.tip}` : over ? `\nDoes not fit: ${money(-fit)} over what is left (still clickable; the card shows the error)` : ''
  const num = (key, d, tip) => `<td class="${POOL_COLS.find(c => c.key === key).cls || ''} ${gradeClass(g, key, p)}" title="${esc(tip || POOL_COLS.find(c => c.key === key).title)}">${poolVal(p, key).toFixed(d)}</td>`
  return `<tr class="${cl}" data-id="${p.id}" draggable="${lock ? 'false' : 'true'}" title="${esc(playerTitle(p))}${esc(fl.tip)}${overTip}">
<td><span class="pcell">${avatarFor(p, 28)}<span class="ptxt"><span class="nm">${esc(p.name)}${p.injury ? '<i class="inj"></i>' : ''}</span><span class="mu">${teamTag(p)}<span class="pos-c xs ${p.pos}">${p.pos}</span>${badge}</span></span></span></td>
<td class="${S.mode === 'cpt' ? 'gold' : ''}" title="${S.mode === 'cpt' ? TIP.cptSal : TIP.flexSal}">${money(poolVal(p, 'salary'))}</td>
<td class="hide-sm rng">${rangeBar(p)}</td>
${num('projection', 1, projTip(p, poolMult())).replace('<td class="', '<td class="hide-xs ')}${num('median', 1).replace('<td class="', '<td class="hide-xs ')}${num('ceiling', 1)}${num('nuke', 1)}
<td class="up hide-xs ${gradeClass(g, 'upside', p)}" title="${esc(POOL_COLS.find(c => c.key === 'upside').title)}">${p.median > 0 && p.projection >= GRADE_MIN_PROJ ? poolVal(p, 'upside').toFixed(1) + '×' : '–'}</td>
<td class="up hide-xs ${gradeClass(g, 'p4x', p)}" title="${esc(POOL_COLS.find(c => c.key === 'p4x').title)}">${p.p4x != null ? poolVal(p, 'p4x').toFixed(0) + '%' : '–'}</td>
<td class="up hide-xs ${gradeClass(g, 'ceilPerK', p)}" title="${esc(POOL_COLS.find(c => c.key === 'ceilPerK').title)}">${poolVal(p, 'ceilPerK').toFixed(2)}</td>
<td class="up hide-xs ${p.shootoutLift != null ? gradeClass(g, 'shootout', p) : ''}" title="${esc(POOL_COLS.find(c => c.key === 'shootout').title)}">${p.shootoutLift != null && p.projection >= GRADE_MIN_PROJ ? signed(p.shootoutLift * 100, 0, '%') : '<span class="dim">–</span>'}</td>
<td class="rel">${ownCellMode(p)}<span class="hint">${hintText(slot, lock)}</span></td>
</tr>`
}

function poolCardHtml(p, v, g, avg) {
  const { slot, isCpt, inFlex, fit, over: over0, lock } = poolFlags(p, v)
  const fl = poolFlag(p, avg)
  const over = over0 && !lock
  const cl = ['pc', p.team, slot != null ? 'in' : '', p.projection <= 0 ? 'zero' : '', fl.cls, over ? 'over' : '', lock ? 'locked' : ''].join(' ').trim()
  return `<div class="${cl}" data-id="${p.id}" draggable="${lock ? 'false' : 'true'}" title="${esc(playerTitle(p))}${esc(fl.tip)}${lock ? `\n${lock.tip}` : over ? `\nDoes not fit: ${money(-fit)} over what is left` : ''}">
${isCpt ? '<span class="badge cpt">CPT</span>' : inFlex ? '<span class="badge">FLEX</span>' : ''}
<div class="top">${avatarFor(p, 48)}<div class="t"><div class="nm">${esc(p.name)}${p.injury ? '<i class="inj"></i>' : ''}</div><div class="mu">${teamTag(p)} <span class="pos-c ${p.pos}">${p.pos}</span></div></div></div>
<div class="prices"><span class="${S.mode === 'cpt' ? 'gold' : ''}">${money(poolVal(p, 'salary'))}</span><span>${ownCellMode(p)}</span></div>
${rangeBar(p)}
<div class="nums"><span title="${esc(projTip(p, poolMult()))}">${poolVal(p, 'projection').toFixed(1)}</span><span class="up ${gradeClass(g, 'ceiling', p)}" title="${TIP.ceil}">${poolVal(p, 'ceiling').toFixed(1)}</span><span class="up ${gradeClass(g, 'nuke', p)}" title="${TIP.nuke}">${poolVal(p, 'nuke').toFixed(1)}</span><span class="up ${gradeClass(g, 'upside', p)}" title="Upside">${p.median > 0 && p.projection >= GRADE_MIN_PROJ ? poolVal(p, 'upside').toFixed(1) + '×' : '–'}</span></div>
<div class="hint">${hintText(slot, lock)}</div>
</div>`
}

function renderPool() {
  const f = S.filters
  const v = localValidate(S.lineup)
  const g = poolGrades()
  const avg = poolAvgPerK()
  const q = f.q.trim().toLowerCase()
  const rows = S.players.filter(p => (!f.team || p.team === f.team) && (!f.pos || p.pos === f.pos) && (!q || p.name.toLowerCase().includes(q))
    && p.salary >= f.minSal && p.salary <= f.maxSal && (!f.fits || lineupHas(p.id) || (poolLastSpotOver(p, v) != null ? poolLastSpotOver(p, v) <= 0 : poolFits(p, v) >= 0)))
  const { key, dir } = S.sort
  const cmp = (a, b) => { const x = poolVal(a, key), y = poolVal(b, key); return (x < y ? -1 : x > y ? 1 : 0) * dir }
  rows.sort((a, b) => sinks(a) - sinks(b) || cmp(a, b) || b.salary - a.salary)   // projection-0 and unplayable players always last, in every sort (D14, Adam 2026-10-12)
  if (S.view === 'cards') document.getElementById('pool-cards').innerHTML = rows.map(p => poolCardHtml(p, v, g, avg)).join('')
  else document.getElementById('pool-body').innerHTML = rows.map(p => poolRowHtml(p, v, g, avg)).join('')
  document.getElementById('pool-wrap').classList.toggle('cards', S.view === 'cards')
  document.querySelectorAll('#pool-head th').forEach(th => {
    const on = th.dataset.key === key
    th.classList.toggle('on', on)
    const arr = th.querySelector('.arr'); if (arr) arr.textContent = on ? (dir > 0 ? '▲' : '▼') : ''
  })
  document.getElementById('pool-count').textContent = `${rows.length} shown`
  document.querySelectorAll('.fchip[data-team]').forEach(b => b.classList.toggle('on', (b.dataset.team || null) === f.team))
  document.querySelectorAll('.fchip[data-pos]').forEach(b => b.classList.toggle('on', (b.dataset.pos || null) === f.pos))
  const fb = document.getElementById('fits-b')
  fb.classList.toggle('on', !!f.fits)
  fb.title = f.fits ? `Showing only players who fit under the ${money(Math.max(0, v.salaryLeft))} left` : 'Show only players who fit under the salary left'
  document.getElementById('view-t').textContent = S.view === 'cards' ? 'Table' : 'Cards'
  document.getElementById('sal-lab').textContent = `${moneyK(f.minSal)}–${moneyK(f.maxSal)}`
  const cs = document.getElementById('card-sort'); if (cs.value !== key) cs.value = key
  document.getElementById('mode-flex').classList.toggle('on', S.mode !== 'cpt')
  document.getElementById('mode-cpt').classList.toggle('on', S.mode === 'cpt')
  document.querySelector('.pool').classList.toggle('cptmode', S.mode === 'cpt')
  const ownTh = document.querySelector('#pool-head th[data-key="own"]'); if (ownTh) ownTh.firstChild.textContent = 'Own'
}

function setMode(mode) { S.mode = mode; renderPool() }

function poolHtml() {
  const head = POOL_COLS.map(c => `<th class="${c.cls || ''}" data-key="${c.key}" title="${esc(c.title)}">${c.label}<span class="arr"></span></th>`).join('')
  const cols = POOL_WIDTHS.map((w, i) => `<col${i === 2 ? ' class="rng"' : i === 4 ? ' class="med"' : ''}${w ? ` style="width:${w}px"` : ''}>`).join('')
  const teams = [['', 'All'], [S.meta.away, S.meta.away], [S.meta.home, S.meta.home]].map(([v, l]) => `<button class="fchip ${v}" data-team="${v}">${v ? teamLogo(v, 14) : ''}${l}</button>`).join('')
  const poss = ['QB', 'RB', 'WR', 'TE', 'K', 'DST'].map(p => `<button class="fchip p-${p}" data-pos="${p}">${p}</button>`).join('')
  const maxSal = Math.max(...S.players.map(p => p.salary))
  const sortOpts = POOL_COLS.map(c => `<option value="${c.key}">${c.key === 'range' ? 'Range' : c.label}</option>`).join('')
  return `<div class="card pool">

<div class="tools">

${teams}<span class="dim">|</span>${poss}<span class="dim">|</span>
<span class="sal-f" title="Salary range filter (FLEX salary)"><span id="sal-lab"></span><input type="range" id="sal-min" min="0" max="${maxSal}" step="200" value="0"><input type="range" id="sal-max" min="0" max="${maxSal}" step="200" value="${maxSal}"></span>
<button class="fchip" id="fits-b">fits $ left</button>
<span class="spacer"></span>
<select id="card-sort" class="btn sm" title="Sort by">${sortOpts}</select>

<div class="scroll" id="pool-wrap"><table class="pool-t"><colgroup>${cols}</colgroup><thead id="pool-head"><tr>${head}</tr></thead><tbody id="pool-body"></tbody></table><div class="cards-grid" id="pool-cards"></div></div>

}

function poolAct(el, ev, forceCpt) {
  const id = el.dataset.id
  if (forceCpt || ev.shiftKey || (S.mode === 'cpt' && !lineupHas(id)) || S.selected === 'cpt') { setCaptain(S.lineup.cpt === id ? null : id); if (S.mode === 'cpt') setMode('flex'); return }
  if (S.lineup.cpt === id && S.selected == null) setCaptain(null)
  else if (lineupHas(id) && S.selected != null && S.selected !== lineupSlotOf(id)) applySwap(S.selected, id)
  else toggleFlex(id)
}

function bindPool() {
  let lastClick = { id: null, t: 0, changed: false }
  const onPick = sel => ev => {
    const el = ev.target.closest(sel); if (!el) return
    if (poolLockById(el.dataset.id)) return   // locked (Adam 2026-10-12, D13): click, shift-click and double-click are all no-ops
    const now = Date.now(), dbl = lastClick.id === el.dataset.id && now - lastClick.t < 350
    const prev = lastClick
    lastClick = { id: el.dataset.id, t: now, changed: false }
    if (dbl) { if (S.lineup.cpt !== el.dataset.id) { if (prev.changed) undoEdit(); setCaptain(el.dataset.id) } return }   // double-click: undo the first click's edit only if it made one (never an earlier edit), then captain
    const before = JSON.stringify(S.lineup)
    poolAct(el, ev)
    lastClick.changed = JSON.stringify(S.lineup) !== before
  }
  document.getElementById('pool-body').addEventListener('click', onPick('tr'))
  document.getElementById('pool-cards').addEventListener('click', onPick('.pc'))
  document.getElementById('mode-flex').addEventListener('click', () => setMode('flex'))
  document.getElementById('mode-cpt').addEventListener('click', () => setMode('cpt'))
  document.getElementById('pool-head').addEventListener('click', ev => {
    const th = ev.target.closest('th'); if (!th) return
    const key = th.dataset.key
    if (S.sort.key === key) S.sort.dir = -S.sort.dir
    else S.sort = { key, dir: (key === 'name' || key === 'pos') ? 1 : -1 }
    renderPool()
  })
  document.getElementById('card-sort').addEventListener('change', ev => { const key = ev.target.value; S.sort = { key, dir: (key === 'name' || key === 'pos') ? 1 : -1 }; renderPool() })
  document.getElementById('view-b').addEventListener('click', () => { S.view = S.view === 'cards' ? 'table' : 'cards'; try { localStorage.setItem('lineuplab-tgff.view', S.view) } catch (e) { /* ignore */ } renderPool() })
  document.getElementById('pool-q').addEventListener('input', ev => { S.filters.q = ev.target.value; renderPool() })
  document.getElementById('fits-b').addEventListener('click', () => { S.filters.fits = !S.filters.fits; renderPool() })
  const smin = document.getElementById('sal-min'), smax = document.getElementById('sal-max')
  const onSal = () => { let a = +smin.value, b = +smax.value; if (a > b) [a, b] = [b, a]; S.filters.minSal = a; S.filters.maxSal = b; renderPool() }
  smin.addEventListener('input', onSal); smax.addEventListener('input', onSal)
  document.querySelector('.pool .tools').addEventListener('click', ev => {
    const b = ev.target.closest('.fchip[data-team],.fchip[data-pos]'); if (!b) return
    if (b.dataset.team != null) S.filters.team = b.dataset.team || null
    if (b.dataset.pos != null) S.filters.pos = S.filters.pos === b.dataset.pos ? null : b.dataset.pos
    renderPool()
  })
  const tip = document.getElementById('tip')
  let seen = false; try { seen = localStorage.getItem('lineuplab-tgff.tip') === '1' } catch (e) { /* ignore */ }
  tip.hidden = seen
  document.getElementById('tip-x').addEventListener('click', () => { tip.hidden = true; try { localStorage.setItem('lineuplab-tgff.tip', '1') } catch (e) { /* ignore */ } })
}


// ---- src/ui/store.js ----
// Saved lineups store (ruling D17): per slate, in save order, kept for good. Two layers:
//  - PURE helpers (top half): record building, duplicate key, sequence numbers, merge, push list, renumbering, filter
//    (role-aware), exposure, kickoff parsing and the archive/purge clocks. No DOM, no storage.
//  - I/O (bottom half): localStorage 'lineuplab-tgff.saved.v2' always (the store on the site and from disk, a backup in
//    the artifact), plus the artifact `db` capability under the viewer's private data/users/<id>/ collection when
//    claude.use('db') and claude.use('user') resolve. Deletes are tombstones ({uid, slateKey, seq, deleted: true}) so a
//    delete on one device is never resurrected by another device's union merge.
// tests/saved.test.mjs loads fmt.js + this file into a node:vm context (with a fake db and storage) and calls both halves.
// Visibility (Adam 2026-10-12): a slate's lineups leave the view from 4:00 AM local on the day after kickoff; nothing is
// deleted from db; the browser copy of a record is dropped 7 days after kickoff ONLY when db has confirmed it, and never
// on a copy with no db (the site, from disk).

const SAVED_LOCAL_KEY = 'lineuplab-tgff.saved.v2'
const SAVED_V1_KEY = 'lineuplab-tgff.saved.v1'
const SAVED_LOCAL_KEEP_MS = 7 * 24 * 3600 * 1000

// ---------------- pure helpers ----------------

function savedSlateKey(meta) {
  return `${meta.season}-w${String(meta.week).padStart(2, '0')}-${meta.slate}-${meta.away}${meta.home}`
}

// Same captain and the same five FLEX in any order = the same DraftKings entry.
function savedDupKey(cpt, flex) { return String(cpt) + '|' + flex.slice().map(String).sort().join(',') }

// Next number for a slate: one past the highest ever used there, tombstones included, so numbers are never reused.
function savedNextSeq(records, slateKey) {
  let max = 0
  for (const r of records) if (r && r.slateKey === slateKey && Number(r.seq) > max) max = Number(r.seq)
  return max + 1
}

// The lineups a slate shows (deleted ones excluded), in save order.
function savedLive(records, slateKey) {
  return records.filter(r => r && r.slateKey === slateKey && !r.deleted).sort((a, b) => a.seq - b.seq || String(a.savedAt).localeCompare(String(b.savedAt)))
}

function savedFinite(x) { return typeof x === 'number' && Number.isFinite(x) ? x : null }

// The three gauge figures at save time from an engine analysis; null when there is no analysis (never 0).
function savedStatsFrom(a, contest) {
  if (!a) return null
  const f = a.feasibility || {}, u = a.uniqueness || {}
  // top 1% and copies are the tiles; pFirst feeds the "1st: 1 in N" hover. No winnings figures (Adam, 2026-10-13).
  const stats = { top1pct: savedFinite(f.pTop1pct), copies: savedFinite(u.expectedCopies), pFirst: savedFinite(f.pFirst), sims: savedFinite(f.sims) }
  if (contest && contest.size) stats.contest = { size: contest.size }
  return stats
}

// One saved lineup. `byId` is the board (Map id -> player); a player missing from it is kept by id with blanks.
function savedBuildRecord({ uid, seq, slateKey, cpt, flex, byId, stats, name, savedAtMs, kickoffMs }) {
  const players = [{ id: cpt, slot: 'CPT' }, ...flex.map(id => ({ id, slot: 'FLEX' }))].map(({ id, slot }) => {
    const p = byId.get(id)
    if (!p) return { id, name: id, team: '', pos: '', salary: null, slot, proj: null }
    return { id, name: p.name, team: p.team, pos: p.pos, salary: slot === 'CPT' ? p.cptSalary : p.salary, slot, proj: savedFinite(p.projection) }
  })
  const known = players.every(p => p.salary != null)
  const projKnown = players.every(p => p.proj != null)
  const salary = known ? players.reduce((s, p) => s + p.salary, 0) : null
  const proj = projKnown ? Math.round(players.reduce((s, p) => s + p.proj * (p.slot === 'CPT' ? 1.5 : 1), 0) * 100) / 100 : null
  const cp = byId.get(cpt)
  return {
    uid, seq, slateKey,
    name: name || `${cp ? lastName(cp.name) : cpt} CPT`,
    cpt, flex: flex.slice(),
    savedAt: new Date(savedAtMs).toISOString(), updatedAt: savedAtMs,
    kickoffAt: kickoffMs != null ? new Date(kickoffMs).toISOString() : null,
    salary, proj, stats: stats || null, players
  }
}

// A record read from outside (db or storage) must carry these with the right types, or it is skipped (never blanked).
function savedValidRecord(r) {
  if (!r || typeof r !== 'object' || typeof r.uid !== 'string' || !r.uid || typeof r.slateKey !== 'string' || savedFinite(r.seq) == null) return false
  if (r.deleted === true) return true
  if (typeof r.cpt !== 'string' || !Array.isArray(r.flex) || r.flex.length !== 5 || r.flex.some(x => typeof x !== 'string')) return false
  if (!Array.isArray(r.players) || r.players.length !== 6 || r.players.some(p => !p || typeof p.id !== 'string')) return false
  const num = x => x == null || savedFinite(x) != null
  if (!num(r.proj) || !num(r.salary)) return false
  // return figures on records saved before 2026-10-13 are ignored, never checked or rewritten
  if (r.stats != null && (typeof r.stats !== 'object' || !num(r.stats.copies) || !num(r.stats.top1pct) || !num(r.stats.pFirst) || !num(r.stats.sims))) return false
  return true
}

// Which of two copies of one uid wins: a tombstone always beats a live copy; otherwise the later edit.
function savedPick(x, y) {
  if (x.deleted && !y.deleted) return x
  if (y.deleted && !x.deleted) return y
  return (Number(y.updatedAt) || 0) > (Number(x.updatedAt) || 0) ? y : x
}

// Union of two lists by uid: every uid from either side survives (as its winning copy).
function savedMerge(a, b) {
  const m = new Map()
  for (const r of [...(a || []), ...(b || [])]) {
    if (!savedValidRecord(r)) continue
    const cur = m.get(r.uid)
    m.set(r.uid, cur ? savedPick(cur, r) : r)
  }
  return [...m.values()].sort((p, q) => p.slateKey.localeCompare(q.slateKey) || p.seq - q.seq)
}

// Confirmed = db has shown or accepted this uid at this version or newer. `confirmed` is {uid: updatedAt}.
function savedIsConfirmed(r, confirmed) { return confirmed[r.uid] != null && Number(confirmed[r.uid]) >= (Number(r.updatedAt) || 0) }

// Every record (any slate) that db has not confirmed at its current version.
function savedPushList(records, confirmed) { return records.filter(r => !savedIsConfirmed(r, confirmed)) }

// After a definitive read of one slate: a record db has never seen whose number is held by a different uid in db
// moves to the next free number (fixes two devices both saving #8 offline, and saves made before db answered).
function savedRenumber(records, remote, slateKey) {
  const seen = new Set(remote.map(r => r.uid))
  const held = new Map(remote.filter(r => r.slateKey === slateKey).map(r => [Number(r.seq), r.uid]))
  let next = savedNextSeq([...records, ...remote], slateKey)
  const changed = []
  const out = records.slice().sort((a, b) => a.seq - b.seq).map(r => {
    if (r.slateKey !== slateKey || seen.has(r.uid)) return r
    const owner = held.get(Number(r.seq))
    if (owner == null || owner === r.uid) return r
    changed.push(r.uid)
    return Object.assign({}, r, { seq: next++, updatedAt: (Number(r.updatedAt) || 0) + 1 })
  })
  return { records: out, changed }
}

function savedIdsOf(r) { return [r.cpt, ...r.flex] }

// A filter pick: a bare id means "Any" (Captain or FLEX); {id, role: 'CPT'|'FLEX'|'ANY'} narrows to that slot.
function savedPickMatches(r, pick) {
  const id = typeof pick === 'string' ? pick : pick.id
  const role = typeof pick === 'string' ? 'ANY' : (pick.role || 'ANY')
  if (role === 'CPT') return r.cpt === id
  if (role === 'FLEX') return r.flex.includes(id)
  return r.cpt === id || r.flex.includes(id)
}

// The lineups matching EVERY pick (AND).
function savedFilter(list, picks) {
  if (!picks || !picks.length) return list.slice()
  return list.filter(r => picks.every(p => savedPickMatches(r, p)))
}

// Exposure over `list`: one row per player with count (lineups holding him), CPT and FLEX counts, pct of the list.
function savedExposure(list) {
  const m = new Map()
  for (const r of list) {
    for (const p of r.players) {
      let e = m.get(p.id)
      if (!e) { e = { id: p.id, name: p.name, team: p.team, pos: p.pos, proj: p.proj, count: 0, cpt: 0, flex: 0 }; m.set(p.id, e) }
      e.count++
      if (p.slot === 'CPT') e.cpt++; else e.flex++
    }
  }
  const n = list.length
  return [...m.values()].map(e => Object.assign(e, { pct: n ? e.count / n * 100 : 0 }))
}

// Sort exposure rows by `key` (count = Exposure, the default; name, cpt, flex, team, proj); ties by count then name.
// A missing projection sorts last in either direction.
function savedSortExposure(rows, dir, key) {
  key = key || 'count'
  const val = e => key === 'name' || key === 'team' ? String(e[key] || '') : e[key]
  return rows.slice().sort((a, b) => {
    const x = val(a), y = val(b)
    if (key === 'proj' && (x == null || y == null) && x !== y) return x == null ? 1 : -1
    const c = typeof x === 'string' ? x.localeCompare(y) : (x || 0) - (y || 0)
    if (key === 'count') return dir * (c || a.cpt - b.cpt) || String(a.name).localeCompare(String(b.name))
    return dir * c || (b.count - a.count) || String(a.name).localeCompare(String(b.name))
  })
}

// A saved lineup scored after the fact (Save pressed before the model finished): fill only a record that still
// needs figures (no stats, or stats without a top-1% rate or copies, e.g. a v1 import), and only with stats that
// carry both when replacing old ones; the edit time moves on so it syncs like any edit. Returns the new record, or null for no change.
function savedStatsComplete(s) { return !!s && savedFinite(s.top1pct) != null && savedFinite(s.copies) != null }
function savedNeedsScore(r) { return !!r && !r.deleted && (r.stats == null || !savedStatsComplete(r.stats)) }
function savedFillStats(r, stats, nowMs) {
  if (!savedNeedsScore(r) || !stats) return null
  if (r.stats != null && !savedStatsComplete(stats)) return null
  return Object.assign({}, r, { stats, updatedAt: Math.max(nowMs, (Number(r.updatedAt) || 0) + 1) })
}

// v1 (one list, newest first, no slate) -> records in the current slate, oldest first; skips duplicates of `existing`.
function savedFromV1(v1, slateKey, byId, existing, newUid, kickoffMs) {
  if (!Array.isArray(v1)) return []
  const out = []
  const seen = new Set(savedLive(existing, slateKey).map(r => savedDupKey(r.cpt, r.flex)))
  for (const x of v1.slice().reverse()) {
    if (!x || typeof x.cpt !== 'string' || !Array.isArray(x.flex) || x.flex.length !== 5 || x.flex.some(id => typeof id !== 'string')) continue
    const k = savedDupKey(x.cpt, x.flex)
    if (seen.has(k)) continue
    seen.add(k)
    const stats = savedFinite(x.copies) != null ? { top1pct: null, copies: savedFinite(x.copies) } : null   // a v1 return figure is ignored
    const ts = Number.isFinite(Number(x.ts)) ? Number(x.ts) : 0
    out.push(savedBuildRecord({ uid: newUid(), seq: savedNextSeq([...existing, ...out], slateKey), slateKey, cpt: x.cpt, flex: x.flex, byId, stats, name: typeof x.name === 'string' ? x.name : '', savedAtMs: ts, kickoffMs }))
  }
  return out
}

// Kickoff text "Mon, Oct 12, 7:15 PM CT" + season -> UTC ms, or null when it cannot be read (then nothing hides).
// The NFL season runs Sep-Feb, so January-May kickoffs fall in season + 1. US zones; daylight time from 2:00 AM on the
// second Sunday of March to 2:00 AM on the first Sunday of November (local clock).
const SAVED_TZ = { ET: -5, CT: -6, MT: -7, PT: -8, EST: -5, CST: -6, MST: -7, PST: -8, EDT: -5, CDT: -6, MDT: -7, PDT: -8 }
const SAVED_MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 }
function savedUsDst(year, month, day, hour) {
  const nthSunday = (m, n) => { const first = new Date(Date.UTC(year, m, 1)).getUTCDay(); return 1 + ((7 - first) % 7) + 7 * (n - 1) }
  const v = month * 10000 + day * 100 + hour
  return v >= 2 * 10000 + nthSunday(2, 2) * 100 + 2 && v < 10 * 10000 + nthSunday(10, 1) * 100 + 2
}
function savedParseKickoff(text, season) {
  const m = /([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{1,2}):(\d{2})\s*([AP])\.?M\.?\s+([A-Z]{2,3})\b/i.exec(String(text || ''))
  if (!m || !Number.isFinite(Number(season))) return null
  const month = SAVED_MON[m[1].toLowerCase()], zone = m[6].toUpperCase()
  if (month == null || !(zone in SAVED_TZ)) return null
  const year = month < 6 ? Number(season) + 1 : Number(season)
  const day = +m[2]
  let hour = +m[3] % 12; if (m[5].toUpperCase() === 'P') hour += 12
  const std = SAVED_TZ[zone]
  const explicit = zone.length === 3 ? zone[1] : null
  const off = explicit === 'D' ? std + 1 : explicit === 'S' ? std : std + (savedUsDst(year, month, day, hour) ? 1 : 0)
  return Date.UTC(year, month, day, hour, +m[4]) - off * 3600 * 1000
}

// 4:00 AM, viewer's local time, on the local day after kickoff: from then the slate's lineups leave the view.
function savedHideAfter(kickoffMs) {
  const d = new Date(kickoffMs)
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 4, 0, 0, 0).getTime()
}
function savedIsArchived(kickoffMs, nowMs) { return kickoffMs != null && Number.isFinite(kickoffMs) && nowMs >= savedHideAfter(kickoffMs) }
// 7 days past its kickoff; records without a kickoff never expire.
function savedLocalExpired(r, nowMs) {
  const k = r && r.kickoffAt ? Date.parse(r.kickoffAt) : NaN
  return Number.isFinite(k) && nowMs >= k + SAVED_LOCAL_KEEP_MS
}
// The browser copy keeps everything unless db is present AND has confirmed the record AND it is 7 days past kickoff.
function savedPurge(records, confirmed, nowMs, hasDb) {
  if (!hasDb) return records
  return records.filter(r => !(savedLocalExpired(r, nowMs) && savedIsConfirmed(r, confirmed)))
}

// The archive shape the lead stores in git: one slate's live lineups in save order.
function savedArchiveJson(records, slateKey, nowMs) {
  return { slateKey, exportedAt: new Date(nowMs).toISOString(), lineups: savedLive(records, slateKey) }
}

function savedNewUid() {
  let s = ''
  try { const b = new Uint8Array(10); crypto.getRandomValues(b); s = Array.from(b, x => x.toString(36).padStart(2, '0')).join('') } catch (e) { s = Math.random().toString(36).slice(2) + Date.now().toString(36) }
  return 'l' + s
}

// ---------------- I/O: localStorage always, the artifact db when it resolves ----------------
// dbMode: 'none' (no db on this view: the site, from disk), 'pending', 'ok' (read and subscribed), 'error' (db
// unreachable; retried on the next save or load), 'nosync' (no viewer id, or the user capability failed).
// note: '' | 'load-failed' | 'write-failed' | 'no-sync' | 'user-error' — what the Saved view says about the Claude copy.
// localOk: false when this browser's storage refused a read or write (the view says lineups will be lost on reload).
const SAVED_STATE = {
  records: [], v1Imported: false, confirmed: {}, slateKey: null, kickoffMs: null, byId: null,
  dbMode: 'none', coll: null, unsub: null, note: '', localOk: true,
  chain: Promise.resolve(), attached: Promise.resolve(), onChange: null
}

function savedChanged() { if (SAVED_STATE.onChange) { try { SAVED_STATE.onChange() } catch (e) { console.error(e) } } }

function savedLocalRead() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVED_LOCAL_KEY) || 'null')
    if (o && Array.isArray(o.records)) return { records: o.records.filter(savedValidRecord), v1Imported: !!o.v1Imported, confirmed: (o.confirmed && typeof o.confirmed === 'object') ? o.confirmed : {} }
  } catch (e) { console.warn('Saved lineups: browser copy unreadable', e); SAVED_STATE.localOk = false }
  return { records: [], v1Imported: false, confirmed: {} }
}
function savedLocalWrite() {
  if (SAVED_STATE.dbMode === 'ok') {
    SAVED_STATE.records = savedPurge(SAVED_STATE.records, SAVED_STATE.confirmed, Date.now(), true)
    const keep = new Set(SAVED_STATE.records.map(r => r.uid))
    for (const u of Object.keys(SAVED_STATE.confirmed)) if (!keep.has(u)) delete SAVED_STATE.confirmed[u]
  }
  try {
    localStorage.setItem(SAVED_LOCAL_KEY, JSON.stringify({ v: 2, v1Imported: SAVED_STATE.v1Imported, confirmed: SAVED_STATE.confirmed, records: SAVED_STATE.records }))
    SAVED_STATE.localOk = true
  } catch (e) { console.warn('Saved lineups: browser storage blocked or full', e); SAVED_STATE.localOk = false }
}

// The lineups the Saved view shows now: none once the slate is archived (4 AM the day after kickoff).
function savedStoreList() { return savedStoreArchived() ? [] : savedLive(SAVED_STATE.records, SAVED_STATE.slateKey) }
function savedStoreArchived() { return savedIsArchived(SAVED_STATE.kickoffMs, Date.now()) }
function savedStoreFind(uid) { return SAVED_STATE.records.find(r => r.uid === uid && !r.deleted) || null }
function savedStoreHasDb() { return SAVED_STATE.dbMode === 'ok' || SAVED_STATE.dbMode === 'pending' || SAVED_STATE.dbMode === 'error' }

// One-time import of the v1 list; runs once, against whatever the store holds when it runs.
function savedImportV1() {
  if (SAVED_STATE.v1Imported) return
  let v1 = null
  try { v1 = JSON.parse(localStorage.getItem(SAVED_V1_KEY) || 'null') } catch (e) { v1 = null }
  const add = savedFromV1(v1, SAVED_STATE.slateKey, SAVED_STATE.byId, SAVED_STATE.records, savedNewUid, SAVED_STATE.kickoffMs)
  SAVED_STATE.records = savedMerge(SAVED_STATE.records, add)
  SAVED_STATE.v1Imported = true     // v1 itself is left in place
  savedLocalWrite()
}

// Called once from init(): browser copy now; the db (and, with a db, the v1 import) later without blocking paint.
function savedStoreInit(meta, byId, onChange) {
  SAVED_STATE.slateKey = savedSlateKey(meta)
  SAVED_STATE.kickoffMs = savedParseKickoff(meta.kickoff, meta.season)
  SAVED_STATE.byId = byId
  SAVED_STATE.onChange = onChange
  const local = savedLocalRead()
  SAVED_STATE.records = local.records
  SAVED_STATE.v1Imported = local.v1Imported
  SAVED_STATE.confirmed = local.confirmed
  const hasRuntime = typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function'
  if (!hasRuntime) savedImportV1()
  else SAVED_STATE.dbMode = 'pending'
  savedChanged()
  SAVED_STATE.attached = hasRuntime ? savedDbAttach() : Promise.resolve()
  return SAVED_STATE.attached
}

async function savedDbAttach() {
  let db = null
  try { db = await window.claude.use('db') }
  catch (e) { console.warn('Saved lineups: claude.use("db") failed', e); return savedNoSync('user-error') }
  if (!db) { SAVED_STATE.dbMode = 'none'; savedImportV1(); savedChanged(); return }   // no db on this view
  let id = null
  try { const user = await window.claude.use('user'); id = user ? await user.id() : null }
  catch (e) { console.warn('Saved lineups: user capability failed', e); return savedNoSync('user-error') }
  if (!id) return savedNoSync('no-sync')
  SAVED_STATE.coll = db.collection('data/users/' + id)
  await savedQueue()
}
function savedNoSync(note) { SAVED_STATE.dbMode = 'nosync'; SAVED_STATE.note = note; savedImportV1(); savedChanged() }

// Syncs run one at a time (which also keeps db writes one at a time), after the first attach finishes.
// Resolves 'none' | 'nosync' | 'ok' | 'load-failed' | 'write-failed'.
function savedQueue() {
  const run = SAVED_STATE.chain.then(savedDbSyncOnce, savedDbSyncOnce)
  SAVED_STATE.chain = run.catch(() => {})
  return run
}
function savedDbSync() { return SAVED_STATE.attached.then(savedQueue, savedQueue) }

async function savedDbSyncOnce() {
  const coll = SAVED_STATE.coll
  if (!coll) return SAVED_STATE.dbMode === 'nosync' ? 'nosync' : 'none'
  const key = SAVED_STATE.slateKey
  if (SAVED_STATE.dbMode !== 'ok') {
    let snap
    try { snap = await coll.where('slateKey', '==', key).get() }
    catch (e) {
      console.warn('Saved lineups: db read failed', e)
      SAVED_STATE.dbMode = 'error'; SAVED_STATE.note = 'load-failed'
      savedImportV1(); savedChanged(); return 'load-failed'
    }
    savedTakeRead(snap, key)
    SAVED_STATE.dbMode = 'ok'
    if (SAVED_STATE.note === 'load-failed') SAVED_STATE.note = ''
    savedLocalWrite()
    savedSubscribe(coll, key)
    savedChanged()
  }
  for (const r of savedPushList(SAVED_STATE.records, SAVED_STATE.confirmed)) {
    try { await coll.doc(r.uid).set(JSON.parse(JSON.stringify(r))); SAVED_STATE.confirmed[r.uid] = r.updatedAt }
    catch (e) { console.warn('Saved lineups: db write failed', e); SAVED_STATE.note = 'write-failed'; savedLocalWrite(); savedChanged(); return 'write-failed' }
  }
  savedLocalWrite()
  if (SAVED_STATE.note === 'write-failed') { SAVED_STATE.note = ''; savedChanged() }
  return 'ok'
}

function savedRemoteDocs(snap) {
  const docs = snap.docs.filter(d => d.exists).map(d => d.data())
  const good = docs.filter(savedValidRecord)
  if (good.length < docs.length) console.warn(`Saved lineups: skipped ${docs.length - good.length} malformed db record(s)`)
  return good
}

// A definitive read: confirm what db holds, merge, run the v1 import against the merged set, then renumber collisions.
function savedTakeRead(snap, key) {
  const good = savedRemoteDocs(snap)
  for (const r of good) SAVED_STATE.confirmed[r.uid] = Math.max(Number(SAVED_STATE.confirmed[r.uid]) || 0, Number(r.updatedAt) || 0)
  SAVED_STATE.records = savedMerge(SAVED_STATE.records, good)
  if (!SAVED_STATE.v1Imported) {
    let v1 = null
    try { v1 = JSON.parse(localStorage.getItem(SAVED_V1_KEY) || 'null') } catch (e) { v1 = null }
    SAVED_STATE.records = savedMerge(SAVED_STATE.records, savedFromV1(v1, key, SAVED_STATE.byId, SAVED_STATE.records, savedNewUid, SAVED_STATE.kickoffMs))
    SAVED_STATE.v1Imported = true
  }
  SAVED_STATE.records = savedRenumber(SAVED_STATE.records, good, key).records
}

// Live updates: merge only (never writes); a server-definitive snapshot also confirms what it shows.
function savedSubscribe(coll, key) {
  if (SAVED_STATE.unsub) return
  SAVED_STATE.unsub = coll.where('slateKey', '==', key).onSnapshot(
    snap => {
      const good = savedRemoteDocs(snap)
      if (!(snap.metadata && (snap.metadata.fromCache || snap.metadata.hasPendingWrites))) for (const r of good) SAVED_STATE.confirmed[r.uid] = Math.max(Number(SAVED_STATE.confirmed[r.uid]) || 0, Number(r.updatedAt) || 0)
      SAVED_STATE.records = savedMerge(SAVED_STATE.records, good)
      savedLocalWrite(); savedChanged()
    },
    err => { console.warn('Saved lineups: live sync stopped', err); SAVED_STATE.unsub = null; SAVED_STATE.dbMode = 'error'; SAVED_STATE.note = 'load-failed'; savedChanged() })
}

// Save: {status: 'incomplete'} | {status: 'dup', record} | {status: 'saved', record, sync: Promise}.
function savedStoreAdd(lineup, byId, stats) {
  const ids = [lineup.cpt, ...lineup.flex]
  if (ids.some(x => !x)) return { status: 'incomplete' }
  const key = savedDupKey(lineup.cpt, lineup.flex)
  const dup = savedLive(SAVED_STATE.records, SAVED_STATE.slateKey).find(r => savedDupKey(r.cpt, r.flex) === key)
  if (dup) return { status: 'dup', record: dup }
  const now = Date.now()
  const rec = savedBuildRecord({ uid: savedNewUid(), seq: savedNextSeq(SAVED_STATE.records, SAVED_STATE.slateKey), slateKey: SAVED_STATE.slateKey, cpt: lineup.cpt, flex: lineup.flex, byId, stats, savedAtMs: now, kickoffMs: SAVED_STATE.kickoffMs })
  SAVED_STATE.records = SAVED_STATE.records.concat([rec])
  savedLocalWrite(); savedChanged()
  return { status: 'saved', record: rec, sync: savedDbSync() }
}

function savedStoreReplace(uid, make) {
  const i = SAVED_STATE.records.findIndex(r => r.uid === uid)
  if (i < 0) return null
  const next = make(SAVED_STATE.records[i])
  SAVED_STATE.records = SAVED_STATE.records.slice(); SAVED_STATE.records[i] = next
  savedLocalWrite(); savedChanged()
  return savedDbSync()
}
function savedStoreRename(uid, name) {
  const clean = String(name || '').trim().slice(0, 60)
  if (!clean) return null
  return savedStoreReplace(uid, r => Object.assign({}, r, { name: clean, updatedAt: Math.max(Date.now(), (Number(r.updatedAt) || 0) + 1) }))
}
function savedStoreFillStats(uid, stats) {
  const r = SAVED_STATE.records.find(x => x.uid === uid)
  if (!savedFillStats(r, stats, Date.now())) return null
  return savedStoreReplace(uid, cur => savedFillStats(cur, stats, Date.now()) || cur)
}
function savedStoreDelete(uid) {
  return savedStoreReplace(uid, r => ({ uid: r.uid, slateKey: r.slateKey, seq: r.seq, kickoffAt: r.kickoffAt || null, deleted: true, updatedAt: Math.max(Date.now(), (Number(r.updatedAt) || 0) + 1) }))
}


// ---- src/ui/lineup.js ----
// Lineup card (the hero of the right column): Captain + five FLEX slots with headshots, team stripe, position chip,
// salary, swap chips under each slot, salary bar, team split, Clear, Save (to the Saved lineups view, D17), undo/redo.
